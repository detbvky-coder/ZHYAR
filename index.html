{t:'وانەی یەکەم',tp:'چەند تێبینیەکی گرنگ · RSI',
 h:[['h','RSI (Relative Strength Index)'],'p:ئیندیکەیتەرێکە بۆ دیاریکردنی زیاد فرۆشتن و زیاد کڕین؛ لە تایم فرەیمی بچووکدا بۆ ئەگەری ڕیترەیسمێنت بەکار دێت، واتا OVER SOLD و OVER BUY مان بۆ دیاری دەکات.','ul:دوو ناوچە: ٣٠ و ٧٠|نرخ بچێتە سەروو ٧٠ = زیاد لە حەددی خۆی کڕین کراوە، دابەزینێکی لە پێشە|نرخ بێتە ژێر ٣٠ = زیاد فرۆشتنی لێکراوە، بەرزبوونەوەیەکی لە پێشە','w:تەنها بۆ دڵنیابوونەوەیە، ترەیدی لەسەر ناکرێت. نرخ دەبێت لە نێوان ٣٠ بۆ ٧٠ بێت؛ ئەگەر لە دەرەوەی بوو واتای ڕیترەیسمێنتە (گەڕانەوەیەک).',['f','rsi','نموونە: RSI گەیشتۆتە ٢٤ و دواتر ڕێک بەرز بۆتەوە؛ لە سەروو ٧٠ەوە ڕێک دابەزیوەتەوە.'],['h','هەواڵە گرنگەکان'],'p:لە ڕێگەی سایتی Forex Factory دەزانین کام ڕۆژ هەواڵ هەیە. هەواڵە High Impact ەکان:','ul:FOMC|NFP|CPI|PPI|PMI|Unemployment claims','p:سێ هەواڵەکەی سەرەتا (یەکەم و دووەم و سێیەم) کاریگەرییەکی ئێجگار گەورەیان هەیە؛ لە یەکەم دەقەی دەرچوونیاندا نزیکەی $٥٠ واتا ٥٠٠ پیپ بازاڕ دەجووڵێنن، تەنها لە یەک بۆ دوو خولەکدا.']},
{t:'وانەی دووەم',tp:'کاندڵ ستیک · تایم فرەیم · لیکویدیتی · ئیمبالانس',
 h:[['h','کاندڵ ستیک'],'p:چوار خاڵی هەر کاندڵێک: Open (O) شوێنی کرانەوە، High (H) بەرزترین خاڵ، Low (L) نزمترین خاڵ، Close (C) داخران.','p:دوو جۆر کاندڵ: بەرزبوون (سەوز، Bullish) و نزمبوون (سوور، Bearish).',['f','candle','ئاناتۆمیی کاندڵی بوڵش و بێرش.'],'p:کاندڵی مۆمێنتۆم (Momentum candle): کاندڵێکی بەهێزە؛ لە بەرزبووندا شادۆی سەرەوەی نییە یان زۆر کەمە، لە نزمبووندا شادۆی خوارەوەی نییە یان زۆر کەمە. واتای ئەوەیە بازاڕ بەو ئاڕاستەیە قەوەتی زۆرە و ئەگەری هەیە بەردەوام بێت، بەتایبەتی لە تایم فرەیمی گەورە.',['h','تایم فرەیم (Time frame)'],'p:پێشاندانی نرخە بە کاندڵ بەپێی ئەو کاتەی دیاری دەکەیت؛ یەک دەقەیی پێشان دەدات لە یەک دەقەدا نرخ چی لێهاتووە، پێنج دەقەیی لە پێنج دەقەدا. بە گۆڕینی تایم فرەیم ناوچەکانی کڕین و فرۆشتن بچووک دەکەینەوە بەم تەکنیکەی SNRZ: سەرەتا لە تایم فرەیمی گەورە زۆن دیاری دەکەین، تایم فرەیمی دواتر تێدەپەڕێنین (skip) و لە تایم فرەیمێکی دواتر زۆنەکە بچووکتر دەکەینەوە.','p:نموونە: لە ٤ سەعاتی زۆنمان دیاری کردووە، ١ سەعاتیمان سکیپ کردووە و هاتووینەتە ٣٠ دەقەیی و زۆنەکەمان بچووک کردۆتەوە.','tb','p:مامۆستا زیندان لە 4H زۆن دیاریدەکات دواتر بچووکی دەکاتەوە؛ بۆ سکاڵپ لە 1H زۆن دیاریدەکات و دواتر بچووکتری دەکاتەوە.',['h','Time frame = Pips'],'p:چەندە تایم فرەیم گەورەتر بێت پیپی زیاتر دەدات، چەندە بچووکتر بێت کەمتر. بۆ M5 هەتا ١٠٠ بۆ ١٥٠ پیپ (١٠ بۆ ١٥ دۆلار) بەسە؛ بۆ H4 هەتا ٣٠٠ بۆ ٤٠٠ پیپ (٣٠ بۆ ٤٠ دۆلار) بەسە. ناکرێت لە ٥ دەقەیی چاوەڕێی هەزار پیپ بکەیت.',['h','لیکویدیتی (Liquidity)'],'p:ئەو شوێنەی کڕیاران یان فرۆشیارانی لێیە؛ هەر سەروو یان خواروو کاندڵێک کە نرخ بۆی نەگەڕابێتەوە، واتا نووکی شادۆی کاندڵەکان.','w:لیکویدیتی تەنها بۆ شوێنی TP بەکار دێت. لیکویدیتییەک کە نرخ بۆی هاتبێتەوە (خورابوو) نابێت TP لەوێ بێت. بەپێی تایم فرەیمی ترەیدکردنت لیکویدیتی دیاری بکە.',['f','liq','سێ جۆر لیکویدیتی: سێیەم لە هەموویان بەهێزترە، پاشان دووەم، پاشان یەکەم.'],['h','ئیمبالانس (Imbalance / FVG)'],'p:ناڕێکییە لە نرخەکاندا؛ سێ کاندڵ بەدوای یەکدا، لە شادۆی کاندڵی یەکەم بۆ شادۆی کاندڵی سێیەم. تەنها بۆ دیاریکردنی TP بەکاری دێنین، بۆ کڕین و فرۆشتن نا.',['f','imb','سێ کاندڵی بەدوای /* lesson index */
.idx{max-width:720px;padding:48px 18px 10px;gap:12px}
.ih{padding:0 0 12px}.ih b{font:800 32px/1.4 var(--kufi)}.ih span{font-size:14px}.ih:after{width:56px;height:3px;border-radius:3px;background:var(--gd)}
.idx a{grid-template-columns:50px 1fr 18px;column-gap:14px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:20px;padding:14px 16px}
.idx a b{grid-row:span 2;width:50px;height:50px;min-width:0;border-radius:15px;background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.3);font:800 22px/48px var(--lat);color:var(--gd)}
.idx a span{font:700 18px/1.6 var(--kufi);color:var(--tx)}
.idx a small{font-size:13.5px;line-height:1.7}
.idx a:after{content:"\2039";grid-column:3;grid-row:1/span 2;color:var(--gd);font-size:26px;line-height:1}
.idx a:active:after,.idx a:active b{color:#000}.idx a:active b{background:transparent}

/* reader */
.lt{background:rgba(8,12,24,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 0;margin:0 0 8px}
.lt a{font-size:14.5px;padding:3px 14px;background:var(--sf)}.lt span{font:600 13px var(--lat)}
@supports (animation-timeline:scroll()){.lt:after{content:"";position:absolute;inset:auto 0 -1px 0;height:2px;background:linear-gradient(270deg,var(--gd),var(--bl));transform-origin:right;transform:scaleX(0);animation:rp linear both;animation-timeline:scroll(root)}@keyframes rp{to{transform:scaleX(1)}}}
body.one main section.opn{padding-top:8px}
.no{font:900 clamp(100px,32vw,140px)/.85 var(--lat);letter-spacing:-.04em;margin:12px 0 -8px;background:linear-gradient(180deg,rgba(242,193,78,.55),rgba(242,193,78,0) 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;opacity:1}
h2{font:800 clamp(26px,7vw,34px)/1.5 var(--kufi);margin:6px 0 0}
h2:after{width:44px;height:3px;border-radius:3px;margin-top:12px;background:var(--gd)}
.tp{display:inline-block;margin:10px 0 16px;padding:2px 14px;border-radius:99px;background:rgba(242,193,78,.1);font-size:14px;line-height:1.9}
h3{font:700 19px/1.7 var(--kufi);margin:38px 0 6px;color:var(--tx)}
h3:before{background:var(--gd);border-radius:2px}
.warn{background:rgba(242,193,78,.08);border:1px solid rgba(242,193,78,.24);border-right:3px solid var(--gd);border-radius:14px;padding:14px 18px;margin:18px 0;color:var(--tx)}
li{margin:7px 0}

/* charts + images */
figure.stg{border-color:#22305a;border-radius:24px;margin:26px -8px;box-shadow:0 24px 60px -24px rgba(0,0,0,.9),0 0 0 1px rgba(91,140,255,.08)}
.cap{border-right-color:var(--gd)}.cap b{color:#ffe08a}.dots i.on{background:var(--gd)}
.bar i{background:linear-gradient(90deg,var(--gd),var(--bl))}.ctl .pl{background:linear-gradient(135deg,#ffe08a,var(--gd))}
figure.ex{border-radius:18px;margin:24px -6px;border-color:var(--ln)}
.tw{border:1px solid var(--ln);border-radius:14px;margin:18px 0}table{border-style:hidden}th{background:rgba(242,193,78,.1)}

/* nav buttons */
.pn{gap:12px;margin-top:48px;padding-top:24px}
.pn a{flex:1;text-align:center;font-size:16px;color:var(--tx);border-radius:16px;padding:13px 14px;background:var(--sf);border:1px solid var(--ln)}
.pn span:empty{flex:1}
.pn a:nth-child(2){background:linear-gradient(135deg,#ffe08a,var(--gd));border-color:transparent;color:#080c18;font-weight:700}
.up{background:rgba(15,21,38,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--gd);border:1px solid rgba(242,193,78,.45);box-shadow:0 10px 26px rgba(0,0,0,.5);font-size:20px}

</style>
<script>(function(){var sx=0,sy=0,st=0,ok=false;
function inScroller(el){while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+4){var o=getComputedStyle(el).overflowX;if(o=='auto'||o=='scroll')return true}el=el.parentElement}return false}
document.addEventListener('touchstart',function(e){
ok=document.body.classList.contains('one')&&e.touches.length==1&&!inScroller(e.target);
if(!ok)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
document.addEventListener('touchend',function(e){
if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<700){
var a=document.querySelector('main section.opn a[href="#home"]');if(a)a.click()}},{passive:true});
})();</script>

#swh.s{animation:swh 2.2s ease forwards}

<style>
h1[role=button]{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .15s ease}
h1[role=button]:active{transform:scale(.95)}
h1[role=button]:focus{outline:none}
h1[role=button].nudge{animation:snb .9s cubic-bezier(.3,.7,.4,1) both}
@keyframes snb{0%{transform:none}22%{transform:translateY(-16px) scale(1.07)}42%{transform:translateY(0) scale(.97)}62%{transform:translateY(-8px) scale(1.03)}82%{transform:translateY(0) scale(.99)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){h1[role=button].nudge{animation:none}}
</style>
<style>
#gl{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px) scale(.97);z-index:21;width:min(92vw,360px);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px 12px 18px;border-radius:24px;background:linear-gradient(135deg,rgba(30,26,14,.92),rgba(12,15,28,.92));border:1px solid rgba(242,193,78,.35);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;overflow:hidden}
#gl:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 50%,rgba(242,193,78,.16),transparent 55%);pointer-events:none}
#gl .tx{position:relative;flex:1;text-align:right;line-height:1.6}
#gl .tx b{display:block;font:600 16px/1.7 'Noto Sans Arabic',sans-serif;color:#f3ecd6;letter-spacing:.01em}
#gl .tx span{display:block;font:400 13.5px/1.6 'Noto Sans Arabic',sans-serif;color:#a9a18a}
#gl .em{position:relative;flex:none;display:flex;direction:ltr}
#gl .em i{font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.07);border:1px solid rgba(242,193,78,.3);box-shadow:0 4px 12px rgba(0,0,0,.35)}
#gl .em i+i{margin-left:-10px;background:rgba(242,193,78,.14)}
#gl.s{animation:gl 4s cubic-bezier(.2,.9,.3,1) forwards}
#gl.s .em i{animation:glf 2s ease-in-out 2 both}#gl.s .em i+i{animation-delay:.25s}
@keyframes gl{0%{opacity:0;transform:translate(-50%,-20px) scale(.97)}8%,90%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px) scale(.98)}}
@keyframes glf{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#gl.s .em i{animation:none}}
</style>

or H4, 300–400 pips ($30–40) is enough. You can't expect a thousand pips on the 5-minute chart.","Liquidity","The place where buyers or sellers are; any high or low of a candle that price has not returned to, i.e. the tips of the candle wicks.","Liquidity is used only for the TP location. Liquidity that price has already returned to (taken) must not be a TP. Mark liquidity according to the timeframe you trade.","Imbalance (FVG)","An inefficiency in prices; three consecutive candles, from the wick of the first candle to the wick of the third. We use it only to set the TP, not for buying and selling."],"2":["Liquidity Sweep and Liquidity Run","Sweep: price returns to the liquidity but only with a wick, without a candle closing above/below the liquidity before it; it signals that price will turn back and reverse.","Run: if a candle closes above or below the liquidity (with its body), the market continues in its direction.","We must wait until the candle closes, because until it closes we do not know whether it is a Run or a Sweep. This is true for every timeframe.","Trend","TREND IS YOUR FRIEND — you must never trade against the trend; it is very dangerous.","How do we know which direction the trend is? See which way the liquidity is being broken; the market is going that way, and you can even tell by eye. The 4H and 1H timeframes are very good for direction.","Marking the zone in SNRZ","With Bearish Engulfing and Bullish Engulfing: first we need a candle that made a big move, then we look at the one candle before it; whichever of them is smaller, with body and wick, we make that the zone.","We rely on the smaller candle and it becomes our zone. Smaller in wick and in everything.","TP locations","Liquidities|Sell zone to buy zone, or buy zone to sell zone|Imbalance"],"3":["DBD and PBP","First we talk about Drop Base Drop: price drops, then ranges, and the market drops again.","That is, the market dumps, then becomes a range for a while, and dumps again.","Now Pump Base Pump: a rise, a range, then a rise again.","That is, the market pumps, then ranges, and pumps again.","It works on every timeframe, and 1H and 30 Min are the best to work with.","Careful: a candle must close with its body above or below the zone we marked; after that we can enter on the pullback.","A few notes","Inside the range the candles are often small; when the range breaks, we can enter on the return to the broken area.","The candle that made the first move must never be broken against its direction; that is, in DBD the candle that made the first big drop must not be broken upward, and likewise for PBP.","Important note: sideways below support means a drop, and sideways above resistance means a rise.","What are Support and Resistance?","Support: any place where price rises.","Resistance: any place where price drops.","Each blue line is a support, and each red line is a resistance.","Very important note: anything that happened in the past may happen again in the future.","Inversion — SBR and RBS","Any zone that breaks immediately becomes its opposite, i.e. an inversion.","That is, any resistance that breaks becomes support, and any support that breaks becomes resistance.","It works on every timeframe, but use it on the Daily and 4H, because there it is very strong.","RBS","Resistance become to Support — the resistance breaks and becomes support; we call it RBS.","SBR","Support become to Resistance — the support breaks and becomes resistance; we call it SBR.","A few very important notes","Trade each zone twice and do not make it three, because the third time it breaks it with about 80% probability|The larger the timeframe, the more reliable it is and the higher the accuracy|We can make the zone only the body, only the wick, or half wick and half body|Marking support and resistance uses the same Bearish Engulfing and Bullish Engulfing, it is easy","It is better to mark the whole candle, with wick and body."],"4":["Key note","Friday is not a good day to trade, and most of the time the market is bullish (rising)|To trade, first we define the reasons for buying and selling so we know whether to focus on buying or selling|If you marked a sell zone and the market broke it and ranged above the sell zone, it is a sign of a rise; if it ranged below a buy area it is a sign of a drop, with about 80% probability|Inversion zones are stronger than fresh ones (win rate 80%–90%)|What happened in the past may happen again in the future (the chart repeats itself)|Always trade with the trend and never go against the trend","SRR","We have a support that breaks two or more resistances before it together (Support break to two Resistance). On the return we can buy, but only after taking confirmation and making sure.","RSS","A resistance that breaks two or more supports before it. On the return we can sell, with confirmation.","It must break two or more before it, not after the support has been formed. These two are stronger on a large timeframe.","How do we know a breakout is not fake?","In a buy zone: if a candle closes with its body (not just a wick) on the 15 or 5-minute below the zone and 75% or more of it is below the zone, it is a valid breakout. If it is less than 75% it becomes an FBC (Fails Break Out) — a fake break that returns again. For a sell zone it must close above the zone the same way.","For the break: in a bullish candle we do not count the lower wick, and apart from that wick 75% or more must be outside the zone; in a drop we do not count the upper wick. If several candles close like this, we are fully sure and enter on the pullback. Trade each zone twice; with about 80% probability it breaks on the third time."],"5":["Valid means the zone is verified","The market must have made a first move and a second move, and one of the moves must be big|It works on every timeframe, but the most important are: Daily, 4 hour and 1 hour|The first move can be anywhere; what matters is that price does not come back below the zone for a Valid Support, and does not come back above the zone for a Valid Resistance","Use them only twice; the third time they will most likely break|The second move counts after the breakout|If we have more than two moves, it is fine and better|If the zone is fresh (it has not been touched), it is much better","Types of zone","S+S, R+S, R+R. The R+S zone is stronger than both of the other types. A zone is defined by a support with the nearest support to it, or a resistance with the nearest resistance; whether it is before it or after it does not matter. R+S is a support with the nearest resistance.","SNRZ and time","On smaller timeframes such as 15M, 5M, 1M there is a chance of three touches. If we marked the zone on the one-hour, we can shrink it and find a smaller valid zone inside the big zone."],"6":["IVS — Inversion Valid Support","We have a Valid Support and the market comes and breaks it; then it turns it into an inversion, meaning the Valid Support becomes an <b>IVS</b> (Inversion Valid Support).","How do we know it has broken? The candle must be 75% outside the zone, or one or two candles must close outside the zone; only then does it count as an inversion.","So the zone that was first used for buying, once it breaks and becomes an inversion, turns into a sell zone. On the pullback we place a <b>Short position</b> and sell.","IVR — Inversion Valid Resistance","A Valid Resistance is the same thing in reverse: the market comes and breaks the Valid Resistance and turns it into an inversion, meaning it becomes an <b>IVR</b> (Inversion Valid Resistance). The break condition is the same: the candle must be 75% above the zone, or one or two candles must close above the zone.","The zone that was first used for selling, once it breaks and becomes an inversion, turns into a buy zone. On the pullback we place a <b>Long position</b> and buy.","IVS = the Valid Support breaks, becomes a sell zone, and we sell on the pullback|IVR = the Valid Resistance breaks, becomes a buy zone, and we buy on the pullback|Before entering, wait for a real break (75% of the candle outside the zone)"],"7":["Inversion Valid Support and Resistance","If a Valid Support is broken it immediately becomes a Valid Resistance (IVS), exactly the opposite, and on the pullback we sell; conversely, if a Valid Resistance breaks it becomes a Valid Support (IVR) and on the pullback we buy. In SNRZ we buy with the target of a sell zone and sell with the target of a buy zone.","How do we know the zone is broken? A candle closes outside the zone with 75% or more of it outside; in a rise we do not count the lower wick and in a drop the upper wick, i.e. we count from the open of the candle. Then the breakout is confirmed and we enter on the pullback. It is better if the candle cuts through with its body and closes; it is better still if the whole candle is outside.","Most important note: before the zone breaks it must respect the zone (honor it and react to it), otherwise it will not be strong. Then, when it breaks, we enter on the pullback.","Careful: even if the first candle did not break it, it must be broken by the following candles with 75% of it outside; for a Valid Support the candle must be bearish, for a Valid Resistance bullish|Trading on an Inversion is much stronger and more reliable (higher accuracy) compared to a fresh zone and it gives more pips, but it must have respected the zone first|There are three other ways to mark a zone: wick to wick (the whole candle), only the body, or half body and half wick","Types of confirmation","Of course, teacher Zindan's preference is the 15M, 5M, 1M timeframes. First we mark a big zone (4H or 1H), then we come to the 5 or 15 minute. One of these four points must have formed:","For buying (Buy): VS, RBS, SRR, IVR|For selling (Sell) — exactly the opposite of buying: VR, SBR, RSS, IVS","It is very easy, don't make it hard on yourself; just think about it logically.","Very important note: we first mark a big zone, and for confirmation we come to the 5-minute or 15-minute timeframe.","Types of confirmation for buying (Buy)","For selling (Sell) it is the same thing in reverse: VR, SBR, RSS, IVS.","Please wait for confirmations — please wait for confirmation and don't rush; the market will not run away from you. Do not enter in any way until a confirmation has formed.","Patterns","1. Double Bottom and Double Top","2. The strongest pattern: QM","3. Another type of pattern","We can use these patterns just like confirmations; careful, any one of the patterns is enough for us, and if there are several it is better.","Confirmation with Back Test","In this lesson we talk more about confirmations together with back testing and a few important notes too ...","Key note","Going back the same way leads to the same goal; that is, whatever mistake you make, learn from it and do not walk that road again, because you will arrive at the same goal and result ...|For the breakout use the 15-minute timeframe.|For confirmation use the 5-minute and 15-minute.|And when volume is high, i.e. the market moves very fast, a 1-minute candle equals a one-hour candle, so be careful when the market has high volume.|Buying at a high carries less risk than buying at a low, and selling at a low carries less risk than selling at a high — be careful; we will explain this with the example on the next page, so keep it well in mind.|Be careful: in a down trend our focus is on selling, and in an up trend our focus is on buying, i.e. the trend is your friend.|Be careful: in a 4-hour sell area you have no business buying just because a Valid Support formed; that is, you cannot compare a 4-hour zone with a 5-minute or 15-minute zone, i.e. in a sell area you have no use for a buy confirmation until it has broken the zone very cleanly and you are sure it is a breakout ...|First mark a zone on a big timeframe and then go to 5M, 15M for confirmation.","The meaning of the previous note","If we have a 4-hour zone, the market came and hit it and a Valid Support confirmation formed, it is better that we do not enter on the return; we can enter, but it carries more risk. Instead let us wait until it breaks the VR and enter on the pullback, which is much lower risk.","That is, here, entering at that green circle is better than entering here. And for the other types of confirmation, likewise wait for it to break a zone for you and enter on the pullback; it is lower risk and better. You can also enter immediately without waiting for this, but it carries more risk. The same applies to buy and to sell, and it is right for either.","If we have a 4-hour sell zone, the market came and hit it and a Valid Resistance confirmation formed, it is better that we do not enter on the return; we can enter, but it carries more risk. Instead let us wait until it breaks the VS and enter on the pullback, which is much lower risk.","That is, here, entering at that green circle is better than entering at the orange one. And for the other types of confirmation, likewise wait; you can also enter immediately without waiting for this, but it carries more risk. The same applies to buy and to sell, and it is right for either.","Example","If we look at this example, we have a 4H IVR and we can buy on it, but we do not enter until confirmation forms. If we come to the 15M, as the picture below shows, a VS confirmation has formed, but we said that if it breaks a zone we then enter on the pullback, which is lower risk. We have a VR zone that has broken; we enter on the pullback, i.e. the green circle, rather than at the red circle, which is the pullback for the S+S zone; that is lower risk, otherwise we can enter at the red circle too.","How do we know which zone it will return to?","Now, how do we know which zone it will return to? We have all four types of confirmation!","Answer / whichever of the zones showed a rejection (i.e. had a reaction), we enter on the return to that one.","How do I know the market will not return to our VS, SRR?","Answer / because the market has broken the VR before it, so it is heading to the higher VR and we can enter on the pullback at a nice zone.","Please wait for confirmations<br>pleaseeeeeeee"],"8":["A few notes","First see whether the market is in an up trend or a down trend|First TP: a valid 5-minute zone; second TP: the liquidity of a valid 1-hour zone|The stop loss is a few pips below or above the zone we entered from, a little farther away because of sweeps|Round by round: little by little, on the 5M and 1M the SBR, RBS and Valid zones come back, and you enter on the breakout pullback... until our full target, i.e. the H1|Do not forget one point: it must respect each zone, and then the entry is on the breakout pullback|In a buy zone we buy with the target of a sell zone, and the opposite|On small timeframes 1M, 5M, 15M, 30M the market has a chance of three touches","Fails Break Out (FBC)","A zone that has broken but does not respect it on the return.","If a structure formed for us we can break even (move the stop to the entry)|In the US session (the New York market), if the market is fast and volume is high, 1M = 1H|If a 1-minute candle closes below the support and the other candles are the same, it is dangerous for buying; the opposite is true for selling","Example: see the market broke it, then when it came back it did not respect it at all and had no reaction, so it has become an FBC.","Please wait for confirmations<br>pleaseeeeeeee"],"9":["PO2 — the strongest topic in SNRZ","Mark the zone on a big timeframe, then take confirmation on a small timeframe|Mark R+R, R+S, S+S zones; they are better for entry|Do not enter without confirmation|Rejection means respect: the zone reacts to it and sends price back","Careful: we mark the zone on 1H/4H, but suppose we have a VS; we do not enter exactly on the big timeframe; one of the confirmations must form on the 5 or 15 minute — for buying: IVR, VS, RBS, SRR; for selling: VR, IVS, SBR, RSS. First we wait for the rejection, then when it breaks and later we enter on the pullback.","Sideways above resistance = a rise and a strong continuation; sideways below support = a drop and a continuation","Question: in a buy zone we bought after confirmation; how and when do we close it in a sell zone? Answer: if a confirmation for selling formed in the sell zone (for example a Valid Support formed but it breaks and becomes an IVS), we can close our orders (can collect), or move the stop to entry (can collect or break even).","You can in no way compare a 1-hour zone with a 5-minute zone, for any of the SNRZ topics.","Conditions of PO2","1 — the market forms a Valid Support or Valid Resistance|2 — it comes back to the valid zone and respects it|3 — it breaks the valid zone (it becomes an inversion)|4 — after breaking, the market comes back again to the broken zone (the support/resistance that sent it back and made the first touch)|5 — it breaks that support or resistance; this is called Break of Structure|6 — when the market returns again to the broken zone, it is called PO2 (the flower of SNRZ)","It must break the zone that made the first touch, including its wick|We must take confirmation, then we enter|Our target is the liquidity of the zone that made the second touch|If it came back to our zone and went sideways, it is more reliable and much stronger|In PO2 the market often leaves only a wick|We can also go round by round with it until the full target|PO2 exists on every timeframe: our zone can be 1-hour and a PO2 on the 5-minute, then it can also become a PO2 on the 1-hour"],"10":["A few notes","Do PO2 with the trend; otherwise wait for it to become an Inversion PO2|For PO2, first mark a VR or VS that respected and broke on the 1H, then come to the 5M and the PO2 forms for you there|At the opening of the sessions, wherever it left a wick is a confirmation for the opposite, very often|If zones are mixed (say an IVR formed and then a VS formed and it became a PO2 too), then it is all one zone and very strong|The market never drops straight and never rises straight; it builds its structure nicely (a rise, a small low, a rise again...)|If we have gone far from the VS and VR, use a larger timeframe to be sure of the break","Inversion PO2 (IPO2)","It makes the PO2 move, but when it comes back to the zone it does not respect it and breaks it, and on the pullback it becomes an IPO2.","Chart example: IPO2 in a rise and in a drop"],"11":["SNRZ Gap = determining direction + order","The space between that support and resistance is called the SNRZ Gap (the red line); the market comes back to it, collects it and returns from there. The same for selling.","Drawing the gap depends on the angle; neither straight nor unreasonable; about a 45° angle|The market collects the gap and then continues in its direction|We must connect the support to the resistance|It has no connection with FVG and imbalance|The distance between the support and the resistance must be a little large; they must not have come back into each other|We can trade on it on a small timeframe, but the Gap is used only to determine direction|We do not count the wick, only the body (the support body to the resistance body) on a line chart|Near the gap the market also makes other zones and confirmations","In SNRZ","Selling at a low carries less risk than selling at a high, and buying at a high carries less risk than buying at a low. Please wait for confirmations. Patience is the key to success — Patience is a key for successfully. Trend is your friend.","Power of the SNRZ topics","Trend|PO2|IPO2|Inversion of zones (IVR and IVS)|Gap|Fresh valid zones (fresh VR and VS)|RBS and SBR|SRR and RSS"],"12":["A few notes","If the SNRZ gap was touched only with a wick, then very likely the next time it comes back to the gap it will make it an inversion gap, and it comes back sharply with a few strong candles and breaks it. We can trade on it, but with confirmation and certainty.","How do we know it is a false breakout? Above or below the liquidity (or our zone) a candle does not close with its body; it only hits it with a wick and returns; very often after the wick it also makes a confirmation candle. Then price comes below the zone that the previous move (the sweeping move) started from and breaks it, and on the pullback we enter that zone. The same for selling.","Do not compare a 4-hour and Daily zone with a 5-minute one and the like, nor a 1-hour with a 5-minute.","Money management","If our capital is small, under $500, we need to use a cent account, and if our amount is large we split the money across several accounts. Suppose we have a bundle of banknotes:","We put ten notes into the scalping account — only for trading 100–200 pips|We put ten notes into the swing account — for long-duration orders that we hold for days|We put ten notes into the war account — for very high risk, full margin and news|The rest of the money we put into a wallet as support for those three accounts; if one of them loses, the profits of the others must refill it","Teacher Zindan says: please listen to the lesson very carefully, several times."],"13":["A few notes","Mark a zone on a big timeframe, come to the 5-minute, take confirmation and enter|The 20-minute timeframe is very concise; he uses it a lot, especially in the US session: on the 20-minute he marks the valid zones and on the 1-minute takes confirmation, but only the inversion confirmations|PO2 exists in every kind: it can be a PO2 on the 5-minute, 15-minute or 20-minute, and later it can become a PO2 on the 1-hour and 4-hour too|The zone must be respected, so it counts as a strong zone|Use the 1-hour and 4-hour timeframes to know the trend: whether supports are breaking or resistances. Trading with the direction of the trend is low risk, and the opposite is high risk"],"14":["The steps","Before the market opens (or when we go to the chart) we look at several Daily or 4-hour candles from the previous 5–6 days to know the direction (up or down)|After knowing the direction we mark three buy zones and three sell zones with the SNRZ topics; if there are many zones in one place, use a larger timeframe|The zones: PO2, RBS, SBR, VR, VS, inversion zones and the other topics|Then we switch to the 1-hour and mark zones for that day|We mark more zones in that trend; for example, if the market is dropping we mark more sell zones and give them more importance|Then we take the confirmations and enter on their pullbacks","Please wait for confirmation in 5M or 15M.","Do not forget the inversion zones|If the market respects our zone and breaks to its opposite, it is very strong|If volume is high, the 1-minute timeframe equals the 1-hour|We compare the reasons for buying and for selling","One very important note","Against the trend it is better to take confirmation on a larger timeframe, but do not trade against the trend; if you do, apply this note.","For FBC: the market comes and breaks the nearest support or the nearest resistance, and we enter on its pullback."],"15":["Notes","Do not take things hard; what is on you is marking the zone, knowing the direction, taking confirmation and entering|Patience and calm are the key of this market; be patient until confirmation forms, and enter after that|Time frame = Pips = Accuracy","When do we buy immediately when it comes to a Valid Support? If it is with the direction of the trend; but when it is against the trend, wait for a valid zone to break and enter on the pullback. Watch the zones: do not be in a sell zone on the 4-hour and Daily and go buy because a buy confirmation formed on the 5-minute.","Please, please always go with the trend — Trend is your friend.","If the market volume is high use 5-minute and 1-minute for confirmation; if it is low, 15M and 20M are better|He also sometimes uses the 1-hour, 4-hour and 2-hour zones to mark zones|If the market is sideways (range) most breakouts are fake; trade only in the direction of the trend and be careful, the market is risky|In a sideways market do not work with the inversion zones, work only with fresh zones","How do we know the market is close to a reversal (Decision making point)?","Watch the Break of Structure; use the 1-hour for reversals. If point B were higher than A, price would have gone higher, but because the peak of B is lower than A and it did not break the previous bottom, it is a sign of a drop and a reversal. For selling it is the same, but it must make a higher bottom than the one before, not a peak.","Example: look at this example; the market is dropping, but at a place where it could not make a lower bottom it reversed from there, then we look for a place to buy.","Sideways above resistance = buy, and sideways below support = sell. Also be careful with the body candle.","During a sideways market do not work with the inversion zones, but only with fresh zones|If in marking a bullish/bearish engulfing zone the candle has a lot of wick, mark the zone from the body of the candle to the end of the wick, and you can trade at 50% of that zone; for selling it is the same, from the upper part of the candle to the end of the upper wick","To understand more, look at this example: the Valid Support candle has a lot of wick; we made the zone from the open of the candle to the end of the wick, and price returned at 50% of the zone (the white line in the middle of the zone). For selling it is the same, but we mark from the upper part of the candle to the end of the upper wick of the candle.","M20 Style","It is used only during the American market (New York) and the volume must be very high, during order flow (a big drop or rise), not a range or sideways. We mark the valid zones by inversion on the 20-minute, then come to the 5 and 1 minute for confirmation. Example: the market is a rising order flow; we wait for a 20-minute valid resistance to form, break, and we enter on the pullback on the 1 and 5 minute; before it breaks the zone it must respect it. The same for selling.","Example (M20 and M5)","Sorry, I brought the example from my mobile because the 20-minute is not available on my TradingView.","If we look at the picture above, we have a rising order flow before it and it is during the American session; a 20-minute valid resistance formed and then broke, i.e. it became an inversion. Then on the pullback we enter with a buy, taking confirmation on the one-minute and the five-minute.","If we look at it, the type of confirmation on the five-minute is IVR 5M (the yellow zone) and we enter on the pullback.","My last advice: money comes after knowledge. Never ever try to trade against the trend — Remember trend is your friend. Always think about the things that people rarely think about.","Thank you a lot teacher Zindan — Towards success, wishing everyone success."]},"ar":{"0":["RSI (مؤشر القوة النسبية)","مؤشر يحدد حالات التشبع الشرائي والبيعي؛ يُستخدم في الأطر الزمنية الصغيرة لاحتمال الارتداد (Retracement)، أي يُظهر لنا OVER SOLD وOVER BUY.","منطقتان: 30 و70|صعود السعر فوق 70 = تشبّع شرائي، ومن المتوقع هبوط|نزول السعر تحت 30 = تشبّع بيعي، ومن المتوقع صعود","للتأكيد فقط، ولا يُتداول بناءً عليه. يجب أن يكون السعر بين 30 و70؛ وإذا خرج عن ذلك فهذا يعني ارتدادًا (Retracement).","الأخبار المهمة","نعرف عبر موقع Forex Factory أي الأيام فيها أخبار. أخبار High Impact:","FOMC|NFP|CPI|PPI|PMI|Unemployment claims","الأخبار الثلاثة الأولى (FOMC وNFP وCPI) تأثيرها ضخم جدًا؛ ففي الدقيقة الأولى بعد صدورها تحرّك السوق نحو 50$ أي 500 نقطة، خلال دقيقة أو دقيقتين فقط."],"1":["الشموع اليابانية","النقاط الأربع لكل شمعة: Open (O) نقطة الفتح، High (H) أعلى نقطة، Low (L) أدنى نقطة، Close (C) الإغلاق.","نوعان من الشموع: صاعدة (خضراء، Bullish) وهابطة (حمراء، Bearish).","شمعة الزخم (Momentum candle): شمعة قوية؛ في الصعود لا ظل لها من الأعلى أو ظلها صغير جدًا، وفي الهبوط لا ظل لها من الأسفل أو ظلها صغير جدًا. أي أن السوق قوي في ذلك الاتجاه ومن المحتمل أن يستمر، خاصة في الإطار الزمني الكبير.","الإطار الزمني (Time frame)","هو عرض السعر على شكل شموع حسب المدة التي تحددها؛ إطار الدقيقة الواحدة يُظهر ما حدث للسعر في دقيقة، وإطار الخمس دقائق في خمس دقائق. وبتغيير الإطار الزمني نصغّر مناطق الشراء والبيع بتقنية SNRZ: نحدد المنطقة أولًا في إطار كبير، ثم نتجاوز الإطار التالي (skip)، وفي إطار لاحق نصغّر المنطقة.","مثال: حددنا المنطقة في إطار 4 ساعات، وتجاوزنا إطار الساعة، ثم انتقلنا إلى 30 دقيقة وصغّرنا المنطقة.","يحدد المعلّم زندان المنطقة في 4H ثم يصغّرها؛ وللسكالبينغ يحددها في 1H ثم يصغّرها أكثر.","Time frame = Pips","كلما كبر الإطار الزمني أعطى نقاطًا أكثر، وكلما صغر أعطى أقل. في M5 تكفي 100 إلى 150 نقطة (10 إلى 15 دولارًا)؛ وفي H4 تكفي 300 إلى 400 نقطة (30 إلى 40 دولارًا). لا يمكن توقّع ألف نقطة في إطار 5 دقائق.","السيولة (Liquidity)","المكان الذي فيه المشترون أو البائعون؛ أي قمة أو قاع شمعة لم يعد إليه السعر، أي أطراف ظلال الشموع.","تُستخدم السيولة فقط لتحديد مكان TP. السيولة التي عاد إليها السعر (استُهلكت) يجب ألا يكون TP عندها. حدّد السيولة حسب الإطار الزمني الذي تتداول عليه.","عدم التوازن (Imbalance / FVG)","هو اختلال في الأسعار؛ ثلاث شموع متتالية، من ظل الشمعة الأولى إلى ظل الشمعة الثالثة. نستخدمه فقط لتحديد TP، وليس للشراء والبيع."],"2":["Liquidity Sweep وLiquidity Run","Sweep: عودة السعر إلى السيولة ولكن بالظل فقط، دون أن تُغلق شمعة فوق/تحت السيولة السابقة؛ وهي إشارة إلى عودة السعر وانعكاسه.","Run: إذا أغلقت شمعة فوق السيولة أو تحتها (بجسمها)، يستمر السوق في اتجاهه.","يجب أن ننتظر حتى تُغلق الشمعة، لأننا قبل إغلاقها لا نعرف هل هي Run أم Sweep. وهذا صحيح لكل الأطر الزمنية.","الاتجاه (Trend)","TREND IS YOUR FRIEND — لا يجوز بأي شكل أن تتداول عكس الاتجاه، فهذا خطير جدًا.","كيف نعرف اتجاه الترند؟ انظر إلى أي اتجاه تُكسر السيولة؛ فالسوق يسير في ذلك الاتجاه، ويمكنك تحديده حتى بالعين. الإطاران 4H و1H ممتازان لتحديد الاتجاه.","تحديد المنطقة في SNRZ","مع Bearish Engulfing وBullish Engulfing: نحتاج أولًا إلى شمعة قامت بحركة كبيرة، ثم ننظر إلى الشمعة التي قبلها؛ أيهما أصغر بالجسم والظل معًا نجعلها المنطقة.","نعتمد على الشمعة الأصغر وتصبح هي منطقتنا. الأصغر بالظل وبكل شيء.","أماكن TP","مناطق السيولة|من منطقة بيع إلى منطقة شراء أو من منطقة شراء إلى منطقة بيع|عدم التوازن (Imbalance)"],"3":["DBD وPBP","نبدأ بـ Drop Base Drop: ينخفض السعر، ثم يتحرك في نطاق جانبي، ثم ينخفض السوق مرة أخرى.","أي أن السوق يهبط بقوة، ثم يصبح نطاقًا لبعض الوقت، ثم يهبط مرة أخرى.","ثم Pump Base Pump: صعود، ثم نطاق جانبي، ثم صعود مرة أخرى.","أي أن السوق يصعد بقوة، ثم يتحرك في نطاق، ثم يصعد مرة أخرى.","يعمل في كل الأطر الزمنية، وأفضلها للعمل 1H و30 Min.","انتبه: يجب أن تُغلق شمعة بجسمها فوق المنطقة التي حددناها أو تحتها، وبعد ذلك يمكننا الدخول عند الـ Pullback.","بعض الملاحظات","داخل النطاق تكون الشموع صغيرة غالبًا؛ وعندما ينكسر النطاق، يمكننا الدخول عند العودة إلى منطقة الكسر.","يجب ألا تُكسر بأي شكل الشمعة التي قامت بالحركة الأولى عكس اتجاهها؛ أي أنه في DBD لا يجوز كسر الشمعة التي صنعت الهبوط الكبير الأول إلى الأعلى، وكذلك في PBP.","ملاحظة مهمة: النطاق الجانبي تحت الدعم يعني هبوطًا، والنطاق الجانبي فوق المقاومة يعني صعودًا.","ما هو الدعم والمقاومة؟","الدعم (Support): أي مكان يرتفع منه السعر.","المقاومة (Resistance): أي مكان ينخفض منه السعر.","كل خط أزرق هو دعم، وكل خط أحمر هو مقاومة.","ملاحظة مهمة جدًا: أي شيء حدث في الماضي قد يحدث مرة أخرى في المستقبل.","الانعكاس (Inversion) — SBR وRBS","أي منطقة تنكسر تصبح فورًا عكسها، أي Inversion.","أي أن كل مقاومة تنكسر تصبح دعمًا، وكل دعم ينكسر يصبح مقاومة.","يعمل في كل الأطر الزمنية، لكن استخدمه في Daily و4H لأنها قوية جدًا فيهما.","RBS","Resistance become to Support — أي تنكسر المقاومة وتصبح دعمًا، ونسميها RBS.","SBR","Support become to Resistance — أي ينكسر الدعم ويصبح مقاومة، ونسميها SBR.","بعض الملاحظات المهمة جدًا","تداول كل منطقة مرتين فقط ولا تجعلها ثلاثًا، لأن المرة الثالثة تكسرها باحتمال 80%|كلما كبر الإطار الزمني زادت الموثوقية والدقة|يمكننا جعل المنطقة الجسم فقط، أو الظل فقط، أو نصف الظل ونصف الجسم|تحديد الدعم والمقاومة يتم بنفس Bearish Engulfing وBullish Engulfing، وهو سهل","الأفضل تحديد الشمعة كاملة بالظل والجسم."],"4":["ملاحظة مهمة","يوم الجمعة ليس جيدًا للتداول، وفي معظم الأوقات يكون السوق صاعدًا (Bullish)|للتداول نحدد أولًا أسباب الشراء والبيع لنعرف هل يكون تركيزنا على الشراء أم البيع|إذا حددت منطقة بيع وكسرها السوق وتحرك في نطاق جانبي فوق منطقة البيع، فهذه علامة على الصعود؛ وإذا تحرك في نطاق جانبي تحت منطقة شراء فهي علامة على الهبوط باحتمال 80%|المناطق المنعكسة (inversion zone) أقوى من المناطق الجديدة (نسبة النجاح 80%–90%)|ما حدث في الماضي قد يحدث في المستقبل (الشارت يعيد نفسه)|تداول دائمًا مع الاتجاه ولا تتداول عكسه أبدًا","SRR","لدينا دعم يكسر مقاومتين أو أكثر قبله معًا (Support break to two Resistance). عند العودة يمكننا الشراء ولكن بعد أخذ التأكيد والتأكد.","RSS","مقاومة تكسر دعمين أو أكثر قبلها. عند العودة يمكننا البيع مع التأكيد.","يجب أن تكسر اثنين أو أكثر قبلها، وليس بعد تشكّل الدعم. وهذان أقوى في الأطر الزمنية الكبيرة.","كيف نعرف أن الاختراق (Break out) ليس كاذبًا؟","في منطقة الشراء: إذا أغلقت شمعة بجسمها (وليس بالظل فقط) على 15 أو 5 دقائق تحت المنطقة وكان 75% أو أكثر منها تحت المنطقة، فهو اختراق صحيح. وإذا كان أقل من 75% يصبح FBC (Fails Break Out) — كسرًا كاذبًا يعود السعر بعده. وفي منطقة البيع يجب أن تُغلق فوق المنطقة بالطريقة نفسها.","بالنسبة للكسر: في الشمعة الصاعدة لا نحسب الظل السفلي، ويجب أن يكون 75% أو أكثر من الشمعة خارج المنطقة بخلاف ذلك الظل؛ وفي الهبوط لا نحسب الظل العلوي. وإذا أغلقت عدة شموع هكذا فقد تأكدنا تمامًا وندخل عند الـ Pullback. تداول كل منطقة مرتين، فباحتمال 80% تنكسر في المرة الثالثة."],"5":["الصالح (Valid) يعني أن المنطقة مُتحقَّق منها","يجب أن يكون السوق قد قام بحركة أولى وحركة ثانية، وأن تكون إحدى الحركتين كبيرة|يعمل في كل الأطر الزمنية، لكن الأهم: اليومي و4 ساعات وساعة واحدة|الحركة الأولى لا يهم أين تكون؛ المهم ألا يعود السعر تحت المنطقة في الدعم الصالح، وألا يعود فوق المنطقة في المقاومة الصالحة","استخدمها مرتين فقط، ففي المرة الثالثة غالبًا ما تنكسر|الحركة الثانية تُحسب بعد الاختراق (Break out)|إذا كان لدينا أكثر من حركتين فلا مشكلة وهو أفضل|إذا كانت المنطقة جديدة (لم يحدث فيها لمس) فهذا أفضل بكثير","أنواع المناطق","S+S وR+S وR+R. منطقة R+S أقوى من النوعين الآخرين. تُحدَّد المنطقة بدعم مع أقرب دعم إليه، أو مقاومة مع أقرب مقاومة؛ سواء كان قبله أو بعده فلا مشكلة. أما R+S فهي دعم مع أقرب مقاومة.","SNRZ والزمن","في الأطر الزمنية الصغيرة مثل 15M و5M و1M هناك احتمال ثلاث لمسات. وإذا حددنا المنطقة على إطار الساعة فيمكننا تصغيرها وإيجاد منطقة صالحة أصغر داخل المنطقة الكبيرة."],"6":["IVS — Inversion Valid Support (الدعم الصالح المنعكس)","لدينا دعم صالح (Valid Support) ويأتي السوق فيكسره؛ عندها يحوّله إلى انعكاس (Inversion)، أي يصبح الدعم الصالح <b>IVS</b> (Inversion Valid Support).","كيف نعرف أنه انكسر؟ يجب أن تكون 75% من الشمعة خارج المنطقة، أو أن تُغلق شمعة أو شمعتان خارج المنطقة؛ عندها يُحسب انعكاسًا.","أي أن المنطقة التي كانت تُستخدم أولًا للشراء، عندما تنكسر وتصبح انعكاسًا، تتحول إلى منطقة بيع. وعند الـ Pullback نفتح <b>Short position</b> ونبيع.","IVR — Inversion Valid Resistance (المقاومة الصالحة المنعكسة)","المقاومة الصالحة (Valid Resistance) هي الشيء نفسه بالعكس: يأتي السوق فيكسر المقاومة الصالحة ويحوّلها إلى انعكاس، أي تصبح <b>IVR</b> (Inversion Valid Resistance). وشرط الكسر نفسه: أن تكون 75% من الشمعة فوق المنطقة، أو أن تُغلق شمعة أو شمعتان فوق المنطقة.","المنطقة التي كانت تُستخدم أولًا للبيع، عندما تنكسر وتصبح انعكاسًا، تتحول إلى منطقة شراء. وعند الـ Pullback نفتح <b>Long position</b> ونشتري.","IVS = ينكسر الدعم الصالح، ويصبح منطقة بيع، ونبيع عند الـ Pullback|IVR = تنكسر المقاومة الصالحة، وتصبح منطقة شراء، ونشتري عند الـ Pullback|قبل الدخول انتظر كسرًا حقيقيًا (75% من الشمعة خارج المنطقة)"],"7":["Inversion Valid Support وResistance","إذا انكسر الدعم الصالح فإنه يصبح فورًا مقاومة صالحة (IVS)، العكس تمامًا، وعند الـ Pullback نبيع؛ وبالعكس إذا انكسرت المقاومة الصالحة تصبح دعمًا صالحًا (IVR) وعند الـ Pullback نشتري. في SNRZ نشتري بهدف منطقة بيع، ونبيع بهدف منطقة شراء.","كيف نعرف أن المنطقة انكسرت؟ تُغلق شمعة خارج المنطقة ويكون 75% أو أكثر منها خارجها؛ في الصعود لا نحسب الظل السفلي وفي الهبوط لا نحسب الظل العلوي، أي نحسب من فتح الشمعة. عندها يتأكد الاختراق وندخل عند الـ Pullback. الأفضل أن تقطع الشمعة بجسمها وتُغلق؛ والأفضل أكثر أن تكون الشمعة كلها خارج المنطقة.","أهم ملاحظة: قبل كسر المنطقة يجب أن تحترم المنطقة (تلتزم بها ويكون لها ردّ فعل)، وإلا فلن تكون قوية. وعندما تنكسر ندخل عند الـ Pullback.","انتبه: حتى لو لم تكسرها الشمعة الأولى، فيجب أن تكسرها الشموع التالية ويكون 75% منها خارج المنطقة؛ وللدعم الصالح تكون الشمعة هابطة، وللمقاومة الصالحة صاعدة|التداول على Inversion أقوى وأكثر موثوقية (دقة أعلى) مقارنة بالمنطقة الجديدة وتعطي نقاطًا أكثر، لكن يجب أن تكون قد احترمت المنطقة أولًا|هناك ثلاث طرق أخرى لتحديد المنطقة: ظل إلى ظل (الشمعة كاملة)، أو الجسم فقط، أو نصف جسم ونصف ظل","أنواع التأكيد","بالطبع الأطر المفضلة للمعلّم زندان هي 15M و5M و1M. نحدد أولًا منطقة كبيرة (4H أو 1H)، ثم ننتقل إلى 5 أو 15 دقيقة. ويجب أن تكون إحدى هذه النقاط الأربع قد تشكلت:","للشراء (Buy): VS وRBS وSRR وIVR|للبيع (Sell) — العكس تمامًا للشراء: VR وSBR وRSS وIVS","الأمر سهل جدًا، لا تصعّبه على نفسك؛ فكّر فيه بطريقة منطقية فقط.","ملاحظة مهمة جدًا: نحدد أولًا منطقة كبيرة، وللتأكيد ننتقل إلى الإطار الزمني 5 دقائق أو 15 دقيقة.","أنواع التأكيد للشراء (Buy)","للبيع (Sell) الأمر نفسه بالعكس: VR وSBR وRSS وIVS.","Please wait for confirmations — من فضلك انتظر التأكيد ولا تستعجل؛ السوق لن يهرب منك. لا تدخل بأي شكل حتى يتشكل التأكيد.","الأنماط (Patterns)","1. Double Bottom وDouble Top","2. أقوى نمط: QM","3. نوع آخر من الأنماط","يمكننا استخدام هذه الأنماط تمامًا مثل التأكيدات؛ انتبه، يكفينا أي نمط واحد منها، وإذا وُجد أكثر من واحد فهو أفضل.","التأكيد مع إعادة الاختبار (Back Test)","في هذا الدرس نتحدث أكثر عن التأكيدات مع إعادة الاختبار (Back Test) وبعض الملاحظات المهمة أيضًا ...","ملاحظة مهمة","السير في الطريق نفسه يوصل إلى الهدف نفسه؛ أي أن أي خطأ ترتكبه تعلّم منه ولا تسر في طريق ذلك الخطأ مرة أخرى، لأنك ستصل إلى الهدف والنتيجة نفسيهما ...|للاختراق (Break out) استخدم الإطار الزمني 15 دقيقة.|للتأكيد استخدم 5 دقائق و15 دقيقة.|وعندما يكون الحجم (Volume) مرتفعًا، أي أن حركات السوق سريعة جدًا، فإن شمعة الدقيقة الواحدة تساوي شمعة الساعة، فانتبه عندما يكون حجم السوق مرتفعًا.|الشراء من القمة أقل مخاطرة من الشراء من القاع، والبيع من القاع أقل مخاطرة من البيع من القمة — انتبه؛ سنشرح هذا بالمثال في الصفحة التالية، فاحفظه جيدًا.|انتبه: مع الترند الهابط يكون تركيزنا على البيع، ومع الترند الصاعد يكون تركيزنا على الشراء، أي أن الترند صديقك.|انتبه: في منطقة بيع على 4 ساعات لا شأن لك بالشراء لمجرد تشكّل دعم صالح؛ أي لا يمكنك مقارنة منطقة 4 ساعات بمنطقة 5 أو 15 دقيقة، أي في منطقة البيع لا حاجة لك بتأكيد شراء حتى تكسرها بوضوح تام وتتأكد أنه اختراق ...|حدد أولًا منطقة على إطار زمني كبير ثم انتقل إلى 5M و15M للتأكيد.","المقصود من الملاحظة السابقة","إذا كانت لدينا منطقة 4 ساعات، وجاء السوق وضربها وتشكل تأكيد دعم صالح، فالأفضل ألا ندخل عند العودة؛ يمكننا الدخول لكن بمخاطرة أكبر. بل ننتظر حتى يكسر الـ VR وندخل عند الـ Pullback، وهو أقل مخاطرة بكثير.","أي هنا، الدخول عند تلك الدائرة الخضراء أفضل من الدخول هنا. وبالنسبة لأنواع التأكيد الأخرى انتظر بالطريقة نفسها حتى يكسر لك منطقة وادخل عند الـ Pullback، فهو أقل مخاطرة وأفضل. ويمكنك الدخول فورًا دون انتظار ذلك، لكن مخاطرته أكبر. وهذا ينطبق على الشراء والبيع، وكلاهما صحيح.","إذا كانت لدينا منطقة بيع على 4 ساعات، وجاء السوق وضربها وتشكل تأكيد مقاومة صالحة، فالأفضل ألا ندخل عند العودة؛ يمكننا الدخول لكن بمخاطرة أكبر. بل ننتظر حتى يكسر الـ VS وندخل عند الـ Pullback، وهو أقل مخاطرة بكثير.","أي هنا، الدخول عند تلك الدائرة الخضراء أفضل من الدائرة البرتقالية. وبالنسبة لأنواع التأكيد الأخرى انتظر بالطريقة نفسها؛ ويمكنك الدخول فورًا دون انتظار ذلك، لكن مخاطرته أكبر. وهذا ينطبق على الشراء والبيع، وكلاهما صحيح.","مثال","إذا نظرنا إلى هذا المثال، لدينا IVR على 4H ويمكننا الشراء عليه، لكننا لا ندخل حتى يتشكل التأكيد. وإذا انتقلنا إلى 15M كما يظهر في الصورة أدناه فقد تشكل تأكيد VS، لكننا قلنا إنه إذا كسر منطقة فإننا ندخل بعد ذلك عند الـ Pullback وهو أقل مخاطرة. لدينا منطقة VR انكسرت؛ ندخل عند الـ Pullback أي الدائرة الخضراء، وليس عند الدائرة الحمراء التي هي Pullback لمنطقة S+S؛ فهذا أقل مخاطرة، وإلا يمكننا الدخول عند الدائرة الحمراء أيضًا.","كيف نعرف إلى أي منطقة سيعود؟","الآن كيف نعرف إلى أي منطقة سيعود؟ فلدينا أنواع التأكيد الأربعة كلها!","الجواب / أي منطقة حدث فيها رفض (Rejection) أي كان لها ردّ فعل، ندخل عند العودة إليها.","كيف أعرف أن السوق لن يعود إلى VS وSRR لدينا؟","الجواب / لأن السوق كسر الـ VR الذي قبله، فهو متجه إلى VR أعلى ويمكننا الدخول عند الـ Pullback في منطقة جيدة.","Please wait for confirmations<br>pleaseeeeeeee"],"8":["بعض الملاحظات","انظر أولًا هل السوق في ترند صاعد أم هابط|TP الأول: منطقة صالحة على 5 دقائق؛ TP الثاني: سيولة منطقة صالحة على ساعة واحدة|وقف الخسارة (Stop Loss) بضع نقاط تحت أو فوق المنطقة التي دخلنا منها، أبعد قليلًا بسبب الـ Sweep|جولة بجولة: شيئًا فشيئًا على 5M و1M يعود السوق إلى مناطق SBR وRBS والمناطق الصالحة، وتدخل عند الـ Pullback بعد الاختراق... حتى هدفنا الكامل أي الـ H1|لا تنسَ نقطة واحدة: يجب أن تحترم كل منطقة، وعندها يكون الدخول عند الـ Pullback بعد الاختراق|في منطقة الشراء نشتري بهدف منطقة بيع، والعكس صحيح|في الأطر الزمنية الصغيرة 1M و5M و15M و30M يوجد احتمال ثلاث لمسات للسوق","Fails Break Out (FBC)","منطقة انكسرت لكنها لا تحترمها عند العودة.","إذا تشكل لنا هيكل (Structure) يمكننا عمل Break Even (نقل الوقف إلى نقطة الدخول)|في جلسة أمريكا (سوق نيويورك)، إذا كان السوق سريعًا والحجم مرتفعًا، فإن 1M = 1H|إذا أُغلقت شمعة دقيقة واحدة تحت الدعم وكانت الشموع الأخرى كذلك، فهذا خطر على الشراء؛ والعكس صحيح للبيع","مثال: انظر، السوق كسرها، ثم عندما عاد لم يحترمها إطلاقًا ولم يكن له أي ردّ فعل، إذن أصبحت FBC.","Please wait for confirmations<br>pleaseeeeeeee"],"9":["PO2 — أقوى موضوع في SNRZ","حدد المنطقة على إطار زمني كبير، ثم خذ التأكيد على إطار زمني صغير|حدد مناطق R+R وR+S وS+S فهي أفضل للدخول|لا تدخل بدون تأكيد|الرفض (Rejection) يعني الاحترام: أن يكون للمنطقة ردّ فعل ويُعيد السعر","انتبه: نحدد المنطقة على 1H/4H، لكن لنفترض أن لدينا VS؛ لا ندخل مباشرة على الإطار الكبير؛ بل يجب أن يتشكل أحد التأكيدات على 5 أو 15 دقيقة — للشراء: IVR وVS وRBS وSRR؛ وللبيع: VR وIVS وSBR وRSS. ننتظر أولًا الرفض، ثم عندما ينكسر ندخل لاحقًا عند الـ Pullback.","النطاق الجانبي فوق المقاومة = صعود واستمرار قوي؛ والنطاق الجانبي تحت الدعم = هبوط واستمرار","سؤال: اشترينا في منطقة شراء بعد التأكيد، فكيف ومتى نغلقها في منطقة البيع؟ الجواب: إذا تشكل في منطقة البيع تأكيد للبيع (مثلًا تشكل دعم صالح لكنه ينكسر ويصبح IVS)، يمكننا إغلاق أوامرنا (can collect)، أو نقل الوقف إلى نقطة الدخول (can collect or break even).","لا يجوز بأي شكل مقارنة منطقة ساعة واحدة بمنطقة 5 دقائق، في أي من مواضيع SNRZ.","شروط PO2","١ — يكوّن السوق دعمًا صالحًا أو مقاومة صالحة|٢ — يعود إلى المنطقة الصالحة ويحترمها|٣ — يكسر المنطقة الصالحة (تصبح Inversion)|٤ — بعد الكسر يعود السوق مرة أخرى إلى المنطقة المكسورة (الدعم/المقاومة التي أعادته وصنعت اللمسة الأولى)|٥ — يكسر ذلك الدعم أو تلك المقاومة؛ ويسمى هذا Break of Structure|٦ — عندما يعود السوق مرة أخرى إلى المنطقة المكسورة يسمى PO2 (زهرة SNRZ)","يجب أن يكسر المنطقة التي صنعت اللمسة الأولى بظلها أيضًا|يجب أن نأخذ التأكيد ثم ندخل|هدفنا هو سيولة المنطقة التي صنعت اللمسة الثانية|إذا عاد إلى منطقتنا وتحرك في نطاق جانبي فهو أكثر موثوقية وأقوى بكثير|في PO2 غالبًا ما يترك السوق ظلًا فقط|يمكننا أيضًا السير معه جولة بجولة حتى الهدف الكامل|PO2 موجود في كل الأطر الزمنية: يمكن أن تكون منطقتنا على ساعة وPO2 على 5 دقائق، ثم يمكن أن يصبح PO2 على الساعة أيضًا"],"10":["بعض الملاحظات","نفّذ PO2 مع الترند، وإلا فانتظر حتى يصبح Inversion PO2|في PO2 حدد أولًا VR أو VS احترم ثم انكسر على 1H، ثم انتقل إلى 5M وهناك يتشكل لك الـ PO2|عند افتتاح الجلسات، المكان الذي ترك فيه ظلًا يكون تأكيدًا للاتجاه المعاكس، وغالبًا ما يكون كذلك|إذا اختلطت المناطق (مثلًا تشكل IVR ثم تشكل VS وأصبح PO2 أيضًا) فهي كلها منطقة واحدة وقوية جدًا|السوق لا يهبط مستقيمًا ولا يصعد مستقيمًا؛ بل يبني هيكله بشكل جميل (صعود، ثم قاع صغير، ثم صعود مرة أخرى...)|إذا ابتعدنا كثيرًا عن VS وVR، فاستخدم إطارًا زمنيًا أكبر للتأكد من الكسر","Inversion PO2 (IPO2)","يقوم بحركة PO2 لكنه عندما يعود إلى المنطقة لا يحترمها ويكسرها، وعند الـ Pullback يصبح IPO2.","مثال على الشارت: IPO2 في الصعود والهبوط"],"11":["فجوة SNRZ = تحديد الاتجاه + الأمر","المسافة بين ذلك الدعم وتلك المقاومة تسمى فجوة SNRZ (الخط الأحمر)؛ يعود السوق إليها ويجمعها (collect) ثم يرتد منها. وكذلك للبيع.","يعتمد رسم الفجوة على الزاوية؛ لا مستقيمة ولا غير معقولة؛ حوالي زاوية 45°|يجمع السوق الفجوة ثم يواصل في اتجاهه|يجب أن نصل الدعم بالمقاومة|لا علاقة لها بـ FVG وimbalance|يجب أن تكون المسافة بين الدعم والمقاومة كبيرة قليلًا، ولا يجوز أن تكون قد دخلتا في بعضهما|يمكننا التداول عليها في إطار زمني صغير، لكن الفجوة تُستخدم فقط لتحديد الاتجاه|لا نحسب الظل، بل الجسم فقط (جسم الدعم إلى جسم المقاومة) على Line Chart|يصنع السوق قرب الفجوة مناطق أخرى وتأكيدات أيضًا","في SNRZ","البيع من القاع أقل مخاطرة من البيع من القمة، والشراء من القمة أقل مخاطرة من الشراء من القاع. Please wait for confirmations. الصبر مفتاح النجاح — Patience is a key for successfully. Trend is your friend.","قوة مواضيع SNRZ","الترند (Trend)|PO2|IPO2|انعكاس المناطق (IVR وIVS)|الفجوة (Gap)|المناطق الصالحة الجديدة (VR وVS جديدة)|RBS وSBR|SRR وRSS"],"12":["بعض الملاحظات","إذا لُمست فجوة SNRZ بالظل فقط، فعلى الأرجح في المرة القادمة التي يعود فيها إلى الفجوة سيحوّلها إلى فجوة Inversion، ويعود بحدة وبعدد قليل من الشموع القوية ويكسرها. يمكننا التداول عليها لكن مع التأكيد والتيقن.","كيف نعرف أنه اختراق كاذب (False Break Out)؟ فوق السيولة أو تحتها (أو منطقتنا) لا تُغلق شمعة بجسمها، بل تضربها بظلها فقط وتعود؛ وكثيرًا ما تصنع بعد الظل شمعة تأكيد. ثم يأتي السعر تحت المنطقة التي بدأت منها الحركة السابقة (حركة الـ Sweep) ويكسرها، وعند الـ Pullback ندخل من تلك المنطقة. وكذلك للبيع.","لا تقارن منطقة 4 ساعات أو يومية بمنطقة 5 دقائق ونحوها، ولا منطقة ساعة بمنطقة 5 دقائق.","إدارة رأس المال (Money management)","إذا كان رأس مالنا قليلًا وأقل من 500$ فعلينا استخدام حساب سنت (Cent)، وإذا كان مبلغنا كبيرًا نوزع الأموال على عدة حسابات. لنفترض أن لدينا رزمة من الأوراق النقدية:","نضع عشر أوراق في حساب السكالبينغ — للتداول على 100–200 نقطة فقط|نضع عشر أوراق في حساب السوينغ — لأوامر المدى الطويل التي نتركها لعدة أيام|نضع عشر أوراق في حساب الحرب (War account) — للمخاطرة العالية جدًا، والهامش الكامل والأخبار|والمال المتبقي نضعه في محفظة لدعم تلك الحسابات الثلاثة؛ فإذا خسرنا في أحدها يجب أن نعوضه من أرباح الباقية","يقول المعلّم زندان: من فضلكم استمعوا إلى الدرس بعناية شديدة، عدة مرات."],"13":["بعض الملاحظات","حدد منطقة على إطار زمني كبير، ثم انتقل إلى 5 دقائق وخذ التأكيد وادخل|الإطار الزمني 20 دقيقة موجز جدًا؛ ويستخدمه المعلّم كثيرًا خاصة في الجلسة الأمريكية: يحدد المناطق الصالحة على 20 دقيقة ويأخذ التأكيد على 1 دقيقة، لكن فقط تأكيدات الـ Inversion|PO2 موجود بكل الأنواع: يمكن أن يكون PO2 على 5 أو 15 أو 20 دقيقة، ثم يمكن أن يصبح PO2 على الساعة و4 ساعات أيضًا|يجب أن تُحترم المنطقة، ولذلك تُعد منطقة قوية|استخدم الإطارين الزمنيين الساعة و4 ساعات لمعرفة الترند: هل تنكسر الدعوم أم المقاومات. التداول مع اتجاه الترند مخاطرته منخفضة، والعكس مخاطرته عالية"],"14":["الخطوات","قبل افتتاح السوق (أو عندما نفتح الشارت) ننظر إلى عدة شموع يومية أو 4 ساعات من 5–6 أيام سابقة لمعرفة الاتجاه (صعود أو هبوط)|بعد معرفة الاتجاه نحدد ثلاث مناطق شراء وثلاث مناطق بيع بمواضيع SNRZ؛ وإذا كانت هناك مناطق كثيرة في مكان واحد فاستخدم إطارًا زمنيًا أكبر|المناطق: PO2 وRBS وSBR وVR وVS ومناطق الـ inversion والمواضيع الأخرى|ثم ننتقل إلى الساعة ونحدد مناطق لذلك اليوم|نحدد مناطق ذلك الترند أكثر؛ فمثلًا إذا كان السوق هابطًا نحدد مناطق بيع أكثر ونعطيها أهمية أكبر|ثم نأخذ التأكيدات وندخل عند الـ Pullback الخاص بها","Please wait for confirmation in 5M or 15M.","لا تنسَ مناطق الـ Inversion|إذا احترم السوق منطقتنا وكسر إلى عكسها فهو قوي جدًا|إذا كان الحجم مرتفعًا فإن إطار 1 دقيقة يساوي 1 ساعة|نقارن أسباب الشراء وأسباب البيع","ملاحظة واحدة مهمة جدًا","عكس الترند يُفضَّل أخذ التأكيد على إطار زمني أكبر، لكن لا تتداول عكس الترند؛ وإذا فعلت فطبّق هذه الملاحظة.","بالنسبة لـ FBC: يأتي السوق ويكسر أقرب دعم أو أقرب مقاومة، وندخل عند الـ Pullback الخاص بها."],"15":["ملاحظات","لا تأخذ الأمور بصعوبة؛ المطلوب منك هو تحديد المنطقة ومعرفة الاتجاه وأخذ التأكيد والدخول|الصبر والهدوء مفتاح هذا السوق؛ اصبر حتى يتشكل التأكيد، ثم ادخل بعد ذلك|Time frame = Pips = Accuracy","متى نشتري فورًا عندما يأتي السعر إلى دعم صالح؟ إذا كان مع اتجاه الترند؛ أما إذا كان عكس الترند فانتظر كسر منطقة صالحة وادخل عند الـ Pullback. راقب المناطق: لا تكن في منطقة بيع على 4 ساعات واليومي ثم تذهب للشراء لأن تأكيد شراء تشكل على 5 دقائق.","أرجوك أرجوك سِر مع الترند دائمًا — Trend is your friend.","إذا كان حجم السوق مرتفعًا فاستخدم 5 دقائق و1 دقيقة للتأكيد؛ وإذا كان منخفضًا فـ 15M و20M أفضل|ويستخدم المعلّم أحيانًا مناطق الساعة و4 ساعات وساعتين لتحديد المناطق|إذا كان السوق جانبيًا (نطاق) فمعظم الاختراقات كاذبة؛ تداول فقط في اتجاه الترند وكن حذرًا فالسوق خطر|في السوق الجانبي لا تعمل بمناطق الـ Inversion، بل اعمل فقط بالمناطق الجديدة","كيف نعرف أن السوق قريب من الانعكاس (Decision making point)؟","انتبه إلى Break of Structure؛ واستخدم الساعة للانعكاسات. لو كانت النقطة B أعلى من A لكان السعر ذهب أعلى، لكن لأن قمة B أدنى من A ولم تكسر القاع السابق، فهذه علامة على الهبوط والانعكاس. وللبيع الأمر نفسه، لكن يجب أن يصنع قاعًا أعلى من الذي قبله، لا قمة.","مثال: انظر إلى هذا المثال؛ السوق هابط، لكن في مكان لم يستطع فيه صنع قاع أدنى انعكس منه، ثم نبحث عن مكان للشراء.","النطاق الجانبي فوق المقاومة = شراء، والنطاق الجانبي تحت الدعم = بيع. وانتبه أيضًا إلى شمعة الجسم.","أثناء السوق الجانبي لا تعمل بمناطق الـ Inversion بل فقط بالمناطق الجديدة|إذا كان ظل الشمعة كبيرًا عند تحديد منطقة Bullish/Bearish Engulfing، فحدد المنطقة من جسم الشمعة إلى نهاية الظل، ويمكنك التداول عند 50% من تلك المنطقة؛ وللبيع الأمر نفسه، من الجزء العلوي للشمعة إلى نهاية الظل العلوي","لمزيد من الفهم انظر إلى هذا المثال: شمعة الدعم الصالح ظلها كبير؛ جعلنا المنطقة من فتح الشمعة إلى نهاية الظل، وعاد السعر من 50% من المنطقة (الخط الأبيض في منتصف المنطقة). وللبيع الأمر نفسه، لكن نحدد من الجزء العلوي للشمعة إلى نهاية الظل العلوي للشمعة.","M20 Style","يُستخدم فقط أثناء السوق الأمريكي (نيويورك) ويجب أن يكون الحجم مرتفعًا جدًا، أثناء Order Flow (هبوط أو صعود كبير) وليس في نطاق أو سوق جانبي. نحدد المناطق الصالحة بالـ Inversion على 20 دقيقة، ثم ننتقل إلى 5 و1 دقيقة للتأكيد. مثال: السوق في Order Flow صاعد؛ ننتظر تشكل مقاومة صالحة على 20 دقيقة، وتنكسر، وندخل عند الـ Pullback على 1 و5 دقائق؛ وقبل كسر المنطقة يجب أن تحترمها. وكذلك للبيع.","مثال (M20 وM5)","عذرًا، أحضرت المثال من هاتفي لأن إطار 20 دقيقة غير متاح في TradingView لدي.","إذا نظرنا إلى الصورة أعلاه، لدينا Order Flow صاعد قبلها وهي أثناء الجلسة الأمريكية؛ تشكلت مقاومة صالحة على 20 دقيقة ثم انكسرت، أي أصبحت Inversion. ثم عند الـ Pullback ندخل شراءً، ونأخذ التأكيد على الدقيقة الواحدة والخمس دقائق.","وإذا نظرنا إليها، فنوع التأكيد على الخمس دقائق هو IVR 5M (المنطقة الصفراء) وندخل عند الـ Pullback.","نصيحتي الأخيرة: المال يأتي بعد العلم. لا تحاول أبدًا أبدًا أن تتداول عكس الترند — Remember trend is your friend. فكّر دائمًا في الأشياء التي يفكر فيها الناس قليلًا.","Thank you a lot teacher Zindan — Towards success، بالتوفيق والنجاح للجميع."]}};
