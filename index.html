document.querySelectorAll('.lg button').forEach(function(b){b.addEventListener('click',run)});run()})();</script><script>(function(){var M={"en": {"نرخ بەرز دەبێتەوە و دێتە ناو زۆنی سێڵ (نموونە R+R).": "Price rises and comes into the sell zone (e.g. R+R).", "زۆنەکە دەشکێنێت (کاندڵ بە بەدی لە سەرووی زۆنەکە دادەخات)؛ دەبوو ببێتە زۆنی بای.": "It breaks the zone (a candle closes with its body above the zone); it should have become a buy zone.", "بەڵام بازاڕ دێتەوە و هیچ ڕیسپێکتێکی لێناکات و دەیبڕێت و دەچێتە خوارەوە: <b>False Break Out</b>، واتا برەیک ئاوتێکی هەڵخەڵەتێنەر.": "But the market comes back, gives no respect at all, cuts through the zone and drops: <b>False Break Out</b>, i.e. a deceptive breakout.", "دووبارە دێتەوە بۆ زۆنەکە و دەبێتەوە بە زۆنی سێڵ؛ لە پوڵ باکدا دووبارە <b>سێڵ</b> دەکەین.": "It comes back to the zone again and it is a sell zone once more; on the pullback we <b>sell</b> again.", "نرخ دادەبەزێت و دێتە ناو زۆنی بای (نموونە S+S).": "Price drops and comes into the buy zone (e.g. S+S).", "زۆنەکە دەشکێنێت (کاندڵ بە بەدی لە خوارووی زۆنەکە دادەخات)؛ دەبوو ببێتە زۆنی سێڵ.": "It breaks the zone (a candle closes with its body below the zone); it should have become a sell zone.", "بەڵام بازاڕ دێتەوە و هیچ ڕیسپێکتێکی لێناکات و دەیبڕێت و دەچێتە سەرەوە: <b>False Break Out</b>، واتا برەیک ئاوتێکی هەڵخەڵەتێنەر.": "But the market comes back, gives no respect at all, cuts through the zone and rises: <b>False Break Out</b>, i.e. a deceptive breakout.", "دووبارە دێتەوە بۆ زۆنەکە و دەبێتەوە بە زۆنی بای؛ لە پوڵ باکدا دووبارە <b>بای</b> دەکەین.": "It comes back to the zone again and it is a buy zone once more; on the pullback we <b>buy</b> again.", "نرخ دادەبەزێت و دێتە سەر زۆنی بای (لیکویدیتی).": "Price drops and comes to the buy zone (liquidity).", "دواتر نرخ دێتە سەرووی ئەو زۆنەی کە جووڵەی پێش خۆی (جووڵەی سویپکردنەکە) لێوە دەستی پێکرد و دەیشکێنێت.": "Then price comes above the zone that the previous move (the sweeping move) started from and breaks it.", "لە پوڵ باکدا بۆ ئەو زۆنە داخڵ دەبین و Buy دەکەین.": "On the pullback we enter that zone and Buy.", "ڕیسیستانسێک نرخ دادەبەزێنێت، پاشان کەمێک بەرزی دەکاتەوە.": "A resistance pushes the price down, then it bounces up a little.", "کاتێک پوڵباکی زۆنەکەمان دەکات، <b>Short position</b> دادەنێین و sell دەکەین.": "When the price pulls back into our zone, we place a <b>Short position</b> and sell.", "سەپۆرتێک نرخ بەرز دەکاتەوە، پاشان کەمێک دایدەگرێت.": "A support lifts the price up, then it pulls back a little.", "کاتێک جووڵەی دووەم دروست دەبێت، زۆنەکە دیاری دەکەین و چاوەڕێی پوڵباکی زۆنەکە دەکەین.": "When the second move forms, we mark the zone and wait for the price to pull back into it.", "کاتێک پوڵباکی زۆنەکەمان دەکات، <b>Long position</b> دادەنێین و buy دەکەین.": "When the price pulls back into our zone, we place a <b>Long position</b> and buy.", "کاتێک نرخ دەگەڕێتەوە ناو زۆنەکە، لێرەدا <b>Long position</b> دەکەینەوە: <b>سەوز</b> ئامانجە (TP)، و <b>سوور</b> Stop Loss ە لە ژێر زۆنەکە.": "When price returns into the zone, we open a <b>Long position</b> here: the <b>green</b> part is the target (TP) and the <b>red</b> part is the stop loss just below the zone.", "کاتێک نرخ دەگەڕێتەوە ناو زۆنەکە، لێرەدا <b>Short position</b> دەکەینەوە: <b>سەوز</b> ئامانجە (TP) لە خوارەوە، و <b>سوور</b> Stop Loss ە لە سەرووی زۆنەکە.": "When price returns into the zone, we open a <b>Short position</b> here: the <b>green</b> part is the target (TP) below, and the <b>red</b> part is the stop loss just above the zone.", "ئیندیکەیتەری <b>RSI</b> لە ژێر چارتەکەیە: زیاد کڕین و زیاد فرۆشتن دیاری دەکات.": "The <b>RSI</b> indicator sits under the chart: it shows overbought and oversold.", "دوو هێڵی هەیە: <b>٧٠</b> و <b>٣٠</b>. نرخ دەبێت لە نێوانیاندا بێت.": "It has two lines: <b>70</b> and <b>30</b>. Price should stay between them.", "RSI گەیشتە سەروو ٧٠ = <b>Over Buy</b>، و نرخ دادەبەزێت.": "RSI went above 70 = <b>Over Buy</b>, and price drops.", "ژێر ٣٠ = <b>Over Sold</b> (نموونە ٢٤) و نرخ بەرز دەبێتەوە. تەنها بۆ دڵنیابوونەوەیە و ترەیدی لەسەر ناکرێت.": "Below 30 = <b>Over Sold</b> (example 24) and price rises. It is only for confirmation; you do not trade on it.", "کاندڵی <b>Bullish</b> (سەوز): نرخ بەرز بۆتەوە.": "<b>Bullish</b> candle (green): price went up.", "<b>High (H)</b> بەرزترین خاڵە و <b>Low (L)</b> نزمترین؛ ئەو هێڵانە شادۆن.": "<b>High (H)</b> is the highest point and <b>Low (L)</b> the lowest; those lines are the wicks.", "<b>Open (O)</b> شوێنی کرانەوە و <b>Close (C)</b> داخران؛ لە Bullish دا C سەرووی O یە.": "<b>Open (O)</b> is where it opens and <b>Close (C)</b> where it closes; in a Bullish candle C is above O.", "کاندڵی <b>Bearish</b> (سوور): پێچەوانەیە، O لە سەرەوە و C لە خوارەوە.": "<b>Bearish</b> candle (red): the opposite, O on top and C at the bottom.", "کاندڵی <b>Momentum</b>: بەهێزە و شادۆی نییە یان زۆر کەمە؛ واتا بازاڕ بەو ئاڕاستەیە قەوەتی زۆرە.": "<b>Momentum</b> candle: strong, with no wick or a very small one; the market is very strong in that direction.", "نووکی شادۆی کاندڵەکان شوێنی <b>Liquidity</b> ە؛ کڕیار و فرۆشیار لێرەن.": "The tips of the candle wicks are where <b>Liquidity</b> is; buyers and sellers are here.", "یەکەم نووک: لیکویدیتییەکی ئاسایی.": "The first tip: ordinary liquidity.", "هێڵی لیکویدیتی. سێ جۆرمان هەیە: یەکەم (کەمتر)، دووەم، و سێیەم (<b>بەهێزترین</b>).": "The liquidity line. We have three types: first (weaker), second, and third (<b>strongest</b>).", "سێ بەرکەوتن بەهێزترە لە دوو و یەک.": "Three touches are stronger than two and one.", "تەنها بۆ <b>TP</b> بەکاری دێنین؛ ئەگەر نرخ بۆی هاتبێتەوە (خورابێت) نابێت TP لەوێ بێت.": "We use it only for <b>TP</b>; if price has already returned to it (taken), TP must not be there.", "سێ کاندڵ بەدوای یەکدا؛ کاندڵی دووەم گەورەیە.": "Three consecutive candles; the second candle is big.", "جیاوازییەکی گەورە لە نێوان کرانەوە و داخرانی کاندڵەکان.": "A big difference between the open and close of the candles.", "لە شادۆی کاندڵی ١ بۆ شادۆی کاندڵی ٣ بۆشاییەکە <b>Imbalance (FVG)</b> ە.": "From the wick of candle 1 to the wick of candle 3, the gap is the <b>Imbalance (FVG)</b>.", "ئەو ناوچەیە ناڕێکییە لە نرخەکاندا.": "That area is an inefficiency in prices.", "نرخ دەگەڕێتەوە بۆی؛ تەنها بۆ شوێنی <b>TP</b> بەکاری دێنین، نەک بۆ کڕین و فرۆشتن.": "Price returns to it; we use it only for the <b>TP</b> location, not for buying and selling.", "نرخ دێتە سەر لیکویدیتییەکە.": "Price comes to the liquidity.", "<b>Sweep</b>: تەنها بە شادۆ لێی دەدات و کاندڵ لە ژێریەوە دادەخات؛ ئاماژەیە بۆ گەڕانەوە و پێچەوانەبوونەوە.": "<b>Sweep</b>: it hits it only with a wick and a candle closes below it; a sign of a return and a reversal.", "<b>Run</b>: کاندڵەکە لە سەروو لیکویدیتییەکەوە دادەخات...": "<b>Run</b>: the candle closes above the liquidity...", "... بۆیە بازاڕ بە ئاڕاستەی خۆی بەردەوام دەبێت. دەبێت چاوەڕێ بکەین تا کاندڵ دادەخات.": "... so the market continues in its direction. We must wait until the candle closes.", "<b>Up Trend</b>: لووتکە و بنکەکان هەمیشە بەرزتر دەبن. لیکویدیتییەکان بەرەو سەرەوە دەشکێن (واتا بازار RBS RBS دروست دەکات).": "<b>Up Trend</b>: peaks and bottoms keep getting higher. Liquidity is broken upward (the market creates RBS RBS).", "<b>Down Trend</b>: لووتکە و بنکەکان نزمتر دەبن؛ لیکویدیتییەکان بەرەو خوارەوە دەشکێن (واتا بازار SBR SBR دروست دەکات).": "<b>Down Trend</b>: peaks and bottoms get lower; liquidity is broken downward (the market creates SBR SBR).", "<b>Side way</b>: بازاڕ لە نێوان دوو نرخدا بەرز و نزمی دەکات (ڕەینج / ڕۆد بلۆک).": "<b>Side way</b>: the market moves up and down between two prices (range / road block).", "نرخ دادەبەزێت.": "Price is dropping.", "کاندڵی یەکەم ① بچووکە.": "The first candle ① is small.", "کاندڵی دووەم ② گەورەترە و ① قووت دەدات: <b>Bullish Engulfing</b>. (بۆ <b>Bearish</b> پێچەوانەکەیە.)": "The second candle ② is bigger and engulfs ①: <b>Bullish Engulfing</b>. (For <b>Bearish</b> it is the opposite.)", "کاندڵە <b>بچووکەکە</b> دەبێتە زۆنەکەمان؛ بچووکتر بە شادۆ و بە هەموو شتەوە.": "The <b>smaller candle</b> becomes our zone; smaller in wick and in everything.", "نرخ بەرز دەبێتەوە و دواتر دەگەڕێتەوە بۆ زۆنەکە.": "Price rises and later returns to the zone.", "لە زۆنەکەوە دووبارە بەرز دەبێتەوە: <b>Buy</b>.": "From the zone it rises again: <b>Buy</b>.", "<b>Drop</b>: نرخ دادەبەزێت.": "<b>Drop</b>: price drops.", "<b>Base</b>: نرخ ڕەینج دەکات و کۆدەبێتەوە.": "<b>Base</b>: price ranges and consolidates.", "دووبارە <b>Drop</b> = <b>DBD</b> (Drop Base Drop).": "<b>Drop</b> again = <b>DBD</b> (Drop Base Drop).", "لە گەڕانەوە بۆ ئەم زۆنە سوورە دەتوانین داخڵ بین. ئاگادار بە: دەبێت کاندڵ لە سەروو یان خوارووی ئەو زۆنەی کە دیاریمان کردووە بە بەدی (واتا بە لاشە) دابخات، دواتر لە پوڵ باکدا دەتوانین داخڵ بین.": "On the return to this red zone we can enter. Careful: a candle must close with its body above or below the zone we marked; after that we can enter on the pullback.", "<b>Pump</b>: نرخ بەرز دەبێتەوە.": "<b>Pump</b>: price rises.", "دووبارە <b>Pump</b> = <b>PBP</b> (Pump Base Pump).": "<b>Pump</b> again = <b>PBP</b> (Pump Base Pump).", "نرخ دووجار دێتە Resistance و دەگەڕێتەوە.": "Price comes to the Resistance twice and returns.", "Resistance شکا (کاندڵ بە بەدی دایخست).": "The Resistance broke (a candle closed with its body).", "هەر زۆنێک کە شکا دەبێتە پێچەوانەکەی: <b>Inversion</b>.": "Any zone that breaks becomes its opposite: <b>Inversion</b>.", "نرخ دەگەڕێتەوە و ئێستا <b>Support</b> ە: <b>RBS</b>.": "Price returns and it is now a <b>Support</b>: <b>RBS</b>.", "نرخ دووجار دێتە Support و دەگەڕێتەوە.": "Price comes to the Support twice and returns.", "Support شکا (کاندڵ بە بەدی دایخست).": "The Support broke (a candle closed with its body).", "نرخ دەگەڕێتەوە و ئێستا <b>Resistance</b> ە: <b>SBR</b>.": "Price returns and it is now a <b>Resistance</b>: <b>SBR</b>.", "نرخ دابەزێت و دوو Resistance دروست دەبن.": "Price drops and two Resistances are formed.", "سەپۆڕتێک دروست دەبێت.": "A support is formed.", "ئەو Supportـە <b>دوو</b> Resistance بە یەکەوە دەشکێنێت (<b>SRR</b>).": "That Support breaks <b>two</b> Resistances together (<b>SRR</b>).", "لە گەڕانەوەدا بۆ ناو زۆنەکە داخڵ دەبین، بەڵام بە <b>کۆنفێرمەیشن</b> و دڵنیایی. دەبێت دوو یان زیاتر بشکێنێت.": "On the return we enter the zone, but with <b>confirmation</b> and certainty. It must break two or more.", "نرخ بەرز دەبێتەوە و دوو Support دروست دەبن.": "Price rises and two Supports are formed.", "ڕیسیستانسێک دروست دەبێت.": "A resistance is formed.", "ئەو Resistanceـە <b>دوو</b> Support بە یەکەوە دەشکێنێت (<b>RSS</b>).": "That Resistance breaks <b>two</b> Supports together (<b>RSS</b>).", "زۆنی کڕینمان هەیە و نرخ دادەبەزێت.": "We have a buy zone and price is dropping.", "کاندڵ بە بەدی دادەخات و <b>75%</b> یان زیاتری لە دەرەوەی زۆنەکەیە (شادۆی خوارەوە حیساب ناکرێت): <b>Confirmed Break Out</b>.": "A candle closes with its body and <b>75%</b> or more of it is outside the zone (the lower wick is not counted): <b>Confirmed Break Out</b>.", "ئەگەر کەمتر لە 75% بوو و تەنها شادۆی لە دەرەوەیە: <b>Fails Break Out (FBC)</b>، شکانێکی ساختەیە و دووبارە دەگەڕێتەوە.": "If it is less than 75% and only its wick is outside: <b>Fails Break Out (FBC)</b>, a fake break that returns again.", "زۆنێک دروست دەبێت.": "A zone is formed.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە بەرز دەبێتەوە و نابێت بێتەوە ژێر زۆنەکە.": "<b>First move</b>: price rises from the zone and must not come back below the zone.", "<b>جووڵەی دووەم</b>: جارێکی تر دێتەوە بۆ زۆنەکە و جووڵەیەکی گەورە دەکات؛ بۆیە سیقە پێکراوە.": "<b>Second move</b>: it comes back to the zone again and makes a big move; that is why it is verified.", "ئێستا <b>Valid Support (VS)</b> ە. تەنها دووجار بەکاری بهێنە، جاری سێیەم بە ئەگەری زۆرەوە دەشکێت.": "Now it is a <b>Valid Support (VS)</b>. Use it only twice; the third time it will most likely break.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە دادەبەزێت و نابێت بچێتەوە سەروو زۆنەکە.": "<b>First move</b>: price drops from the zone and must not go back above the zone.", "<b>جووڵەی دووەم</b>: جارێکی تر دێتەوە بۆ زۆنەکە و دابەزینێکی گەورە دەکات؛ بۆیە سیقە پێکراوە.": "<b>Second move</b>: it comes back to the zone again and makes a big drop; that is why it is verified.", "ئێستا <b>Valid Resistance (VR)</b> ە. تەنها دووجار بەکاری بهێنە، جاری سێیەم بە ئەگەری زۆرەوە دەشکێت.": "Now it is a <b>Valid Resistance (VR)</b>. Use it only twice; the third time it will most likely break.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە بەرز دەبێتەوە.": "<b>First move</b>: price rises from the zone.", "<b>جووڵەی دووەم</b>: دێتەوە بۆ زۆنەکە و جووڵەیەکی گەورە دەکات.": "<b>Second move</b>: it comes back to the zone and makes a big move.", "<b>S+S</b>: سەپۆڕت لەگەڵ نزیکترین سەپۆڕت لە خۆیەوە.": "<b>S+S</b>: a support with the nearest support to it.", "<b>R+S</b>: سەپۆڕت لەگەڵ نزیکترین ڕیسیستانس. لە هەردووک جۆرەکەی تر بەقەوەتترە.": "<b>R+S</b>: a support with the nearest resistance. It is stronger than both of the other types.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە دادەبەزێت.": "<b>First move</b>: price drops from the zone.", "<b>جووڵەی دووەم</b>: دێتەوە بۆ زۆنەکە و دابەزینێکی گەورە دەکات.": "<b>Second move</b>: it comes back to the zone and makes a big drop.", "<b>R+R</b>: ڕیسیستانس لەگەڵ نزیکترین ڕیسیستانس.": "<b>R+R</b>: a resistance with the nearest resistance.", "زۆنێکی گەورەی کڕین (Buy zone) لە 4H یان 1H دیاری دەکەین.": "We mark a big buy zone (Buy zone) on the 4H or 1H.", "نرخ دادەبەزێتە ناو زۆنەکە.": "Price drops into the zone.", "لە 5M یان 15M دا <b>VS</b> دروست دەبێت: ڤاڵد سەپۆڕت، دوو جووڵە.": "On the 5M or 15M a <b>VS</b> forms: a Valid Support, two moves.", "لە پوڵ باک (بازنەکە) داخڵ دەبین و <b>Buy</b> دەکەین.": "We enter on the pullback (the circle) and <b>Buy</b>.", "لە 5M یان 15M دا <b>RBS</b> دروست دەبێت: ڕیسیستانسێک دەشکێت و دەبێتە سەپۆڕت.": "On the 5M or 15M an <b>RBS</b> forms: a resistance breaks and becomes a support.", "لە 5M یان 15M دا <b>SRR</b> دروست دەبێت: سەپۆڕتێک دوو ڕیسیستانس بە یەکەوە دەشکێنێت.": "On the 5M or 15M an <b>SRR</b> forms: a support breaks two resistances together.", "<b>Double Bottom</b>: نرخ دوو جار دەگاتە هەمان زۆنی کڕین و دوو بنکەی هاوشێوە دروست دەکات؛ نیشانەی بەرزبوونەوە.": "<b>Double Bottom</b>: price reaches the same buy zone twice and makes two similar bottoms; a sign of a rise.", "<b>Double Top</b>: نرخ دوو جار دەگاتە هەمان زۆنی فرۆشتن و دوو لووتکەی هاوشێوە دروست دەکات؛ نیشانەی دابەزین.": "<b>Double Top</b>: price reaches the same sell zone twice and makes two similar tops; a sign of a drop.", "دووجار لێدانی هەمان زۆن (بازنەکان) وەک کۆنفێرمەیشن بەکار دێت.": "Hitting the same zone twice (the circles) is used as confirmation.", "<b>QM بۆ کڕین</b>: نرخ بنکەی پێشوو دەشکێنێت و دەچێتە ناو زۆنەکە، پاشان بەرز دەبێتەوە.": "<b>QM for buying</b>: price breaks the previous bottom and goes into the zone, then rises.", "<b>QM بۆ فرۆشتن</b>: نرخ لووتکەی پێشوو دەشکێنێت و دەچێتە ناو زۆنەکە، پاشان دادەبەزێت.": "<b>QM for selling</b>: price breaks the previous top and goes into the zone, then drops.", "QM بەقەوەترین پاتێرنە؛ هەر کامێکیان هەبێت وەک کۆنفێرمەیشن کافییە.": "QM is the strongest pattern; having either one is enough as confirmation.", "نرخ چەند جارێک لە ناو زۆنی کڕین دەچێت و دێت (ڕەنج)، پاشان شادۆیەکی درێژ بەرەو خوارەوە دروست دەکات و دەگەڕێتەوە؛ پاشان بەرز دەبێتەوە.": "Price goes in and out of the buy zone several times (a range), then makes a long wick downward and returns; then it rises.", "هەمان شت بۆ فرۆشتن: ڕەنج لە ناو زۆنی فرۆشتن، پاشان شادۆیەکی درێژ بەرەو سەرەوە و دابەزین.": "The same for selling: a range inside the sell zone, then a long wick upward and a drop.", "ئەمەش جۆرێکی تری پاتێرنەکانە و وەک کۆنفێرمەیشن بەکار دێت.": "This is another type of pattern and it is used as confirmation.", "زۆنێکی گەورەی کڕین (<b>Buy zone</b>) لە 4H یان 1H دیاری دەکەین.": "We mark a big buy zone (<b>Buy zone</b>) on the 4H or 1H.", "بازاڕ دادەبەزێتە ناو زۆنەکە.": "The market drops into the zone.", "کۆنفێرمەیشنی <b>VS</b> دروست دەبێت، پاشان بازاڕ <b>IVR</b>ی پێش خۆی دەشکێنێت.": "A <b>VS</b> confirmation forms, then the market breaks the <b>IVR</b> before it.", "سەوزە (پوڵ باکی IVR) داخڵبوونی بێ ڕیسکترە؛ لێرە (پوڵ باکی VS) دەشێت بەڵام ڕیسکی زیاترە.": "Green (the IVR pullback) is the lower-risk entry; here (the VS pullback) it is possible but riskier.", "زۆنێکی گەورەی فرۆشتن (<b>Sell zone</b>) لە 4H یان 1H دیاری دەکەین.": "We mark a big sell zone (<b>Sell zone</b>) on the 4H or 1H.", "بازاڕ دێتە ناو زۆنەکە و <b>VR</b> دروست دەبێت.": "The market comes into the zone and a <b>VR</b> forms.", "دواتر VRەکە دەشکێت و دەبێتە <b>IVS</b>.": "Then the VR breaks and becomes an <b>IVS</b>.", "سەوزە (پوڵ باکی IVS) داخڵبوونی بێ ڕیسکترە؛ پرتەقاڵیەکە (پوڵ باکی VR) ڕیسکی زیاترە.": "Green (the IVS pullback) is the lower-risk entry; the orange one (the VR pullback) is riskier.", "زۆنی گەورە دیاری دەکەین و بازاڕ دەچێتە ناوی.": "We mark a big zone and the market goes into it.", "لە ناو زۆنەکەدا چەند جۆرێک کۆنفێرمەیشن دروست دەبێت: <b>IVR</b> ، <b>RBS</b> ، <b>VS , SRR</b>.": "Inside the zone several types of confirmation form: <b>IVR</b>, <b>RBS</b>, <b>VS, SRR</b>.", "بۆ کام زۆنمان دێتەوە؟ بۆ ئەو زۆنەی ڕیجێکشنی تێدا کرد.": "Which zone does it return to? To the zone where it showed a rejection.", "بازاڕ VRەکەی پێش خۆی شکاندووە، کەواتە بەرەو سەرەوە دەڕوات و لە پوڵ باکدا داخڵ دەبین.": "The market has broken the VR before it, so it is going up and we enter on the pullback.", "<b>VR</b> ێکی ڤاڵد دروست دەبێت لە <b>R+R</b>: دوو ڕیسیستانس. هێڵی سەرەوە سەری لووتکەکەیە و هێڵی خوارەوە سەری کاندڵی گەڕانەوەی دوای دابەزینە؛ نێوانیان زۆنەکەیە. دواتر نرخ دادەبەزێت.": "A valid <b>VR</b> forms from an <b>R+R</b>: two resistances. The upper line is the head of the peak and the lower line is the head of the bounce candle after the drop; the zone is between them. Then price drops.", "نرخ دێتەوە بۆ زۆنەکە و یەکەم تەچی پێ دەکات: <b>ڕیسپێکت</b>.": "Price comes back to the zone and makes the first touch: <b>respect</b>.", "دواتر زۆنەکە دەشکێنێت (<b>break</b>): ئێستا <b>Inversion</b> ە.": "Then it breaks the zone (<b>break</b>): it is now an <b>Inversion</b>.", "ئەو لووتکەیەی کە گەڕاندیەوە بۆ زۆنەکە و یەکەم تەچی پێ کرد؛ هێڵەکەی دیاری دەکەین.": "The peak that sent it back to the zone and made the first touch; we mark its line.", "ئەو لووتکەیە دەشکێنێت: <b>Break of Structure</b>.": "It breaks that peak: <b>Break of Structure</b>.", "نرخ بە یەک کاندڵ ناگەڕێتەوە؛ بە سێ چوار کاندڵ دەگەڕێتەوە بۆ زۆنە شکاوەکە (<b>pull back</b>): ئەمە <b>PO2</b> — گوڵی SNRZ. بە کۆنفێرمەیشن داخڵ دەبین و ستۆپ لە ژێر زۆنەکەیە.": "Price does not come back in one candle; in three or four candles it comes back to the broken zone (<b>pull back</b>): this is <b>PO2</b> — the flower of SNRZ. We enter with confirmation and the stop is below the zone.", "نرخ بەرز دەبێتەوە بۆ <b>Target</b>: لووتکەی سەرووی هێڵەکە و لیکویدیتییەکەی، ئەوە TP ەکەمانە.": "Price rises to the <b>Target</b>: the peak above the line and its liquidity; that is our TP.", "<b>VS</b> ێکی ڤاڵد دروست دەبێت لە <b>S+S</b>: دوو سەپۆڕت. هێڵی خوارەوە بنی دۆڵەکەیە و هێڵی سەرەوە بنی کاندڵی گەڕانەوەی دوای بەرزبوونەوەیە؛ نێوانیان زۆنەکەیە. دواتر نرخ بەرز دەبێتەوە.": "A valid <b>VS</b> forms from an <b>S+S</b>: two supports. The lower line is the bottom of the valley and the upper line is the bottom of the bounce candle after the rise; the zone is between them. Then price rises.", "ئەو دۆڵەی کە گەڕاندیەوە بۆ زۆنەکە و یەکەم تەچی پێ کرد؛ هێڵەکەی دیاری دەکەین.": "The valley that sent it back to the zone and made the first touch; we mark its line.", "ئەو دۆڵە دەشکێنێت: <b>Break of Structure</b>.": "It breaks that valley: <b>Break of Structure</b>.", "نرخ بە یەک کاندڵ ناگەڕێتەوە؛ بە سێ چوار کاندڵ دەگەڕێتەوە بۆ زۆنە شکاوەکە (<b>pull back</b>): ئەمە <b>PO2</b> — گوڵی SNRZ. بە کۆنفێرمەیشن داخڵ دەبین و ستۆپ لە سەرووی زۆنەکەیە.": "Price does not come back in one candle; in three or four candles it comes back to the broken zone (<b>pull back</b>): this is <b>PO2</b> — the flower of SNRZ. We enter with confirmation and the stop is above the zone.", "نرخ دادەبەزێت بۆ <b>Target</b>: دۆڵی خوارووی هێڵەکە و لیکویدیتییەکەی، ئەوە TP ەکەمانە.": "Price drops to the <b>Target</b>: the valley below the line and its liquidity; that is our TP.", "نرخ بەرز دەبێتەوە و دێتە سەر <b>زۆنەکە</b>.": "Price rises and comes to the <b>zone</b>.", "نرخ جووڵەی PO2 دەکات: دەگەڕێتەوە بۆ زۆنەکە و ڕیسپێکتی دەکات.": "Price makes the PO2 move: it returns to the zone and respects it.", "دواتر زۆنەکە دەشکێنێت و کە دێتەوە بۆی ڕیسپێکتی ناکات؛ دەبێتە <b>IPO2</b> و نرخ دادەبەزێت.": "Then it breaks the zone and when it comes back to it, it does not respect it; it becomes an <b>IPO2</b> and price drops.", "نرخ دادەبەزێت و دێتە سەر <b>زۆنەکە</b>.": "Price drops and comes to the <b>zone</b>.", "نرخ جووڵەی PO2 دەکات: دێتەوە بۆ زۆنەکە و ڕیسپێکتی دەکات.": "Price makes the PO2 move: it comes to the zone and respects it.", "دواتر زۆنەکە دەشکێنێت و کە دێتەوە بۆی ڕیسپێکتی ناکات؛ دەبێتە <b>IPO2</b> و نرخ بەرز دەبێتەوە.": "Then it breaks the zone and when it comes back to it, it does not respect it; it becomes an <b>IPO2</b> and price rises.", "ترێند بەرزبوونەوەیە: نرخ بەرز دەبێتەوە و سەپۆڕت و ڕیسیستانس دروست دەکات.": "A trend is a rise: price rises and creates supports and resistances.", "سەپۆڕت و ڕیسیستانسەکە بە <b>هێڵی سوور</b> دەگەیەنین (گۆشەی نزیکەی ٤٥)؛ ئەوە <b>Gap SNRZ</b> ە و زۆنەکەی لەسەر دیاری دەکرێت.": "We connect the support and resistance with a <b>red line</b> (an angle of about 45); that is the <b>Gap SNRZ</b>, and the zone is marked on it.", "بازاڕ دێتەوە ناو زۆنەکە و گاپەکە <b>کۆلێکت</b> دەکات.": "The market comes back into the zone and <b>collects</b> the gap.", "دواتر بە ئاڕاستەی <b>ترێند</b> بەردەوام دەبێت؛ گاپ بۆ دیاریکردنی ئاڕاستەیە.": "Then it continues in the direction of the <b>trend</b>; the gap is for determining direction.", "ترێند دابەزینە: نرخ دادەبەزێت و ڕیسیستانس و سەپۆڕت دروست دەکات.": "A trend is a drop: price drops and creates resistances and supports.", "ڕیسیستانس و سەپۆڕتەکە بە <b>هێڵی سوور</b> دەگەیەنین (گۆشەی نزیکەی ٤٥)؛ ئەوە <b>Gap SNRZ</b> ە و زۆنەکەی لەسەر دیاری دەکرێت.": "We connect the resistance and support with a <b>red line</b> (an angle of about 45); that is the <b>Gap SNRZ</b>, and the zone is marked on it.", "نرخ بەرز دەبێتەوە و دێتە سەر زۆنی سێڵ (لیکویدیتی).": "Price rises and comes to the sell zone (liquidity).", "لێرە کاندڵ بە بەدی داناخات؛ تەنها بە <b>شادۆ</b> لە زۆنەکە دەدات و دەگەڕێتەوە (<b>False Break Out</b>). زۆر جار دوای شادۆکە کاندڵی کۆنفێرمەیشن دروست دەکات.": "Here a candle does not close with its body; it hits the zone only with a <b>wick</b> and returns (<b>False Break Out</b>). Very often after the wick it makes a confirmation candle.", "دواتر نرخ دێتە ژێر ئەو زۆنەی کە جووڵەی پێش خۆی (جووڵەی سویپکردنەکە) لێوە دەستی پێکرد و دەیشکێنێت.": "Then price comes below the zone that the previous move (the sweeping move) started from and breaks it.", "لە پوڵ باکدا بۆ ئەو زۆنە داخڵ دەبین و سێڵ دەکەین؛ بۆ بایش هەمان شتە بە پێچەوانەوە.": "On the pullback we enter that zone and sell; for buying it is the same in reverse.", "نرخ دادەبەزێت و دێتە سەر زۆنەکە.": "Price drops and comes to the zone.", "زۆنەکە دەشکێنێت، بەڵام کاندڵ بە بەدی لە دەرەوە داناخات و 75%ی لە دەرەوە نییە: <b>Fails Break Out (FBC)</b>.": "It breaks the zone, but a candle does not close outside with its body and 75% of it is not outside: <b>Fails Break Out (FBC)</b>.", "دواتر نرخ دێتەوە و <b>نزیکترین ڕیسیستانس</b> (هێڵی سەوز) دەشکێنێت.": "Then price comes back and breaks the <b>nearest resistance</b> (the green line).", "لە پوڵ باکدا بۆ ئەو هێڵە داخڵ دەبین؛ بۆ سێڵیش هەمان شتە بە پێچەوانەوە.": "On the pullback we enter that line; for selling it is the same in reverse.", "بازاڕ بەرز دەبێتەوە و لووتکە <b>A</b> دروست دەکات.": "The market rises and makes peak <b>A</b>.", "لووتکەی <b>B</b> نزمترە لە A.": "Peak <b>B</b> is lower than A.", "بنکەی پێشوو نەشکاوە.": "The previous bottom has not been broken.", "ئەمە نیشانەی دابەزین و <b>پێچەوانەبوونەوەیە</b> (Decision making point). بۆ سێڵیش بە پێچەوانەوە.": "This is a sign of a drop and a <b>reversal</b> (Decision making point). For selling it is the opposite.", "بۆ ئەم مەسەلەیە تایم فرەیمی یەک سەعاتی باشترە.": "For this matter the one-hour timeframe is better.", "ئۆردەر فلۆی بەرزبوونە (لە کاتی بازاڕی ئەمریکا و ڤۆلیۆمی بەرز): نرخ دێتە سەر <b>VR 20M</b>.": "A rising order flow (during the American market and with high volume): price comes to the <b>VR 20M</b>.", "نرخ <b>ڕیسپێکتی</b> زۆنەکە دەکات: دێتەوە ناوی و دەگەڕێتەوە؛ ئەمە پێش شکاندن پێویستە.": "Price <b>respects</b> the zone: it comes into it and returns; this is needed before the break.", "دواتر زۆنەکە <b>دەشکێنێت</b> و دەبێتە ئینڤێرژن (IVR).": "Then it <b>breaks</b> the zone and it becomes an inversion (IVR).", "لە پوڵ باکدا بۆ زۆنەکە داخڵ دەبین؛ لە 5 دەقەیی و 1 دەقەیی کۆنفێرمەیشن وەردەگرین و بای دەکەین.": "On the pullback we enter that zone; on the 5-minute and 1-minute we take confirmation and buy.", "ئۆردەر فلۆی دابەزینە (لە کاتی بازاڕی ئەمریکا و ڤۆلیۆمی بەرز): نرخ دێتە سەر <b>VS 20M</b>.": "A dropping order flow (during the American market and with high volume): price comes to the <b>VS 20M</b>.", "نرخ <b>ڕیسپێکتی</b> زۆنەکە دەکات: دێتە سەری و دەگەڕێتەوە؛ ئەمە پێش شکاندن پێویستە.": "Price <b>respects</b> the zone: it comes onto it and returns; this is needed before the break.", "دواتر زۆنەکە <b>دەشکێنێت</b> و دەبێتە ئینڤێرژن (IVS).": "Then it <b>breaks</b> the zone and it becomes an inversion (IVS).", "لە پوڵ باکدا بۆ زۆنەکە داخڵ دەبین؛ لە 5 دەقەیی و 1 دەقەیی کۆنفێرمەیشن وەردەگرین و سێڵ دەکەین.": "On the pullback we enter that zone; on the 5-minute and 1-minute we take confirmation and sell.", "<b>Double Bottom</b>: دوو بنکەی هاوشێوە؛ نیشانەی بەرزبوونەوە.": "<b>Double Bottom</b>: two similar bottoms; a sign of a rise.", "<b>Double Top</b>: دوو لووتکەی هاوشێوە؛ نیشانەی دابەزین.": "<b>Double Top</b>: two similar peaks; a sign of a drop.", "<b>QM</b>: بەقەوەترین پاتێرنە. هەر کامێکیان هەبێت وەک کۆنفێرمەیشن کافییە.": "<b>QM</b>: the strongest pattern. Having any one of them is enough as a confirmation.", "زۆنێکی گەورەی کڕینمان هەیە لە 4H یان 1H.": "We have a big buy zone on the 4H or 1H.", "لە تایم فرەیمی 5M یان 15M دا <b>VS</b> دروست دەبێت (یەکێک لە چوار کۆنفێرمەیشنەکە: VS ، RBS ، SRR ، IVR).": "On the 5M or 15M timeframe a <b>VS</b> forms (one of the four confirmations: VS, RBS, SRR, IVR).", "باشترە چاوەڕێی شکان بکەین و لە <b>پوڵ باک</b> دا داخڵ بین.": "It is better to wait for the break and enter on the <b>pullback</b>.", "ئەنجام: <b>Buy</b>. بۆ فرۆشتن: VR ، SBR ، RSS ، IVS. چاوەڕێی کۆنفێرمەیشن بکە و پەلە مەکە.": "Result: <b>Buy</b>. For selling: VR, SBR, RSS, IVS. Wait for confirmation and don't rush.", "زۆنێکی ڤاڵد.": "A valid zone.", "نرخ دێتەوە و <b>PO2</b> دروست دەکات.": "Price comes back and forms a <b>PO2</b>.", "بەڵام ئەم جارە زۆنەکە <b>ڕیسپێکت ناکات</b> و دەیشکێنێت.": "But this time it <b>does not respect</b> the zone and breaks it.", "کە دێتەوە بۆ زۆنە شکاوەکە لە پوڵ باکدا: <b>Inversion PO2 (IPO2)</b>.": "When it returns to the broken zone on the pullback: <b>Inversion PO2 (IPO2)</b>.", "<b>ڤاڵد سەپۆڕت (VS)</b> مان هەیە: دوو جووڵەی کردووە و کڕیارەکان لێی بەرز بوونەتەوە.": "We have a <b>Valid Support (VS)</b>: it made two moves and buyers pushed price up from it.", "بازاڕ دێتەوە بۆ زۆنەکە.": "The market comes back to the zone.", "زۆنەکە دەشکێنێت: کاندڵ بە بەدی لە خوارووی زۆنەکە دادەخات و <b>75%</b> یان زیاتری لە دەرەوەیە؛ یاخود یەک دوو کاندڵ لە دەرەوە دادەخەن. ئێستا <b>Inversion</b> ە: ڤاڵد سەپۆڕت دەبێتە <b>IVS</b> و زۆنی سێڵ.": "It breaks the zone: a candle closes with its body below the zone and <b>75%</b> or more of it is outside; or one or two candles close outside. Now it is an <b>Inversion</b>: the Valid Support becomes an <b>IVS</b> and a sell zone.", "لە پوڵ باکدا (٣ - ٤ کاندڵ) دێتەوە بۆ زۆنە شکاوەکە؛ <b>Short position</b> دادەنێین و <b>سێڵ</b> دەکەین: <b>سوور</b> Stop Loss ە لە سەروو زۆنەکە و <b>سەوز</b> ئامانجە (TP).": "On the pullback (3–4 candles) it comes back to the broken zone; we place a <b>Short position</b> and <b>sell</b>: <b>red</b> is the Stop Loss above the zone and <b>green</b> is the target (TP).", "نرخ دادەبەزێت بۆ <b>Target</b> و TP دەخوات.": "Price drops to the <b>Target</b> and hits the TP.", "<b>ڤاڵد ڕیسیستانس (VR)</b> مان هەیە: دوو جووڵەی کردووە و فرۆشیارەکان لێی دابەزیون.": "We have a <b>Valid Resistance (VR)</b>: it made two moves and sellers pushed price down from it.", "زۆنەکە دەشکێنێت: کاندڵ بە بەدی لە سەرووی زۆنەکە دادەخات و <b>75%</b> یان زیاتری لە دەرەوەیە؛ یاخود یەک دوو کاندڵ لە دەرەوە دادەخەن. ئێستا <b>Inversion</b> ە: ڤاڵد ڕیسیستانس دەبێتە <b>IVR</b> و زۆنی بای.": "It breaks the zone: a candle closes with its body above the zone and <b>75%</b> or more of it is outside; or one or two candles close outside. Now it is an <b>Inversion</b>: the Valid Resistance becomes an <b>IVR</b> and a buy zone.", "لە پوڵ باکدا (٣ - ٤ کاندڵ) دێتەوە بۆ زۆنە شکاوەکە؛ <b>Long position</b> دادەنێین و <b>بای</b> دەکەین: <b>سوور</b> Stop Loss ە لە ژێر زۆنەکە و <b>سەوز</b> ئامانجە (TP).": "On the pullback (3–4 candles) it comes back to the broken zone; we place a <b>Long position</b> and <b>buy</b>: <b>red</b> is the Stop Loss below the zone and <b>green</b> is the target (TP).", "نرخ بەرز دەبێتەوە بۆ <b>Target</b> و TP دەخوات.": "Price rises to the <b>Target</b> and hits the TP."}, "ar": {"نرخ بەرز دەبێتەوە و دێتە ناو زۆنی سێڵ (نموونە R+R).": "يرتفع السعر ويدخل منطقة البيع (مثلًا R+R).", "زۆنەکە دەشکێنێت (کاندڵ بە بەدی لە سەرووی زۆنەکە دادەخات)؛ دەبوو ببێتە زۆنی بای.": "يكسر المنطقة (تُغلق شمعة بجسمها فوق المنطقة)؛ وكان يُفترض أن تصبح منطقة شراء.", "بەڵام بازاڕ دێتەوە و هیچ ڕیسپێکتێکی لێناکات و دەیبڕێت و دەچێتە خوارەوە: <b>False Break Out</b>، واتا برەیک ئاوتێکی هەڵخەڵەتێنەر.": "لكن السوق يعود ولا يحترمها إطلاقًا، فيخترقها ويهبط: <b>False Break Out</b>، أي اختراق كاذب مخادع.", "دووبارە دێتەوە بۆ زۆنەکە و دەبێتەوە بە زۆنی سێڵ؛ لە پوڵ باکدا دووبارە <b>سێڵ</b> دەکەین.": "يعود إلى المنطقة مرة أخرى فتصبح منطقة بيع من جديد؛ وعند الـ Pullback <b>نبيع</b> مرة أخرى.", "نرخ دادەبەزێت و دێتە ناو زۆنی بای (نموونە S+S).": "ينخفض السعر ويدخل منطقة الشراء (مثلًا S+S).", "زۆنەکە دەشکێنێت (کاندڵ بە بەدی لە خوارووی زۆنەکە دادەخات)؛ دەبوو ببێتە زۆنی سێڵ.": "يكسر المنطقة (تُغلق شمعة بجسمها تحت المنطقة)؛ وكان يُفترض أن تصبح منطقة بيع.", "بەڵام بازاڕ دێتەوە و هیچ ڕیسپێکتێکی لێناکات و دەیبڕێت و دەچێتە سەرەوە: <b>False Break Out</b>، واتا برەیک ئاوتێکی هەڵخەڵەتێنەر.": "لكن السوق يعود ولا يحترمها إطلاقًا، فيخترقها ويرتفع: <b>False Break Out</b>، أي اختراق كاذب مخادع.", "دووبارە دێتەوە بۆ زۆنەکە و دەبێتەوە بە زۆنی بای؛ لە پوڵ باکدا دووبارە <b>بای</b> دەکەین.": "يعود إلى المنطقة مرة أخرى فتصبح منطقة شراء من جديد؛ وعند الـ Pullback <b>نشتري</b> مرة أخرى.", "نرخ دادەبەزێت و دێتە سەر زۆنی بای (لیکویدیتی).": "ينخفض السعر ويأتي إلى منطقة الشراء (السيولة).", "دواتر نرخ دێتە سەرووی ئەو زۆنەی کە جووڵەی پێش خۆی (جووڵەی سویپکردنەکە) لێوە دەستی پێکرد و دەیشکێنێت.": "ثم يأتي السعر فوق المنطقة التي بدأت منها الحركة السابقة (حركة الـ Sweep) ويكسرها.", "لە پوڵ باکدا بۆ ئەو زۆنە داخڵ دەبین و Buy دەکەین.": "عند الـ Pullback ندخل تلك المنطقة ونشتري (Buy).", "ڕیسیستانسێک نرخ دادەبەزێنێت، پاشان کەمێک بەرزی دەکاتەوە.": "مقاومةٌ تدفع السعر إلى الأسفل، ثم يرتفع قليلًا.", "کاتێک پوڵباکی زۆنەکەمان دەکات، <b>Short position</b> دادەنێین و sell دەکەین.": "عندما يرتد السعر إلى منطقتنا، نفتح <b>Short position</b> ونبيع.", "سەپۆرتێک نرخ بەرز دەکاتەوە، پاشان کەمێک دایدەگرێت.": "دعمٌ يرفع السعر إلى الأعلى، ثم يتراجع قليلًا.", "کاتێک جووڵەی دووەم دروست دەبێت، زۆنەکە دیاری دەکەین و چاوەڕێی پوڵباکی زۆنەکە دەکەین.": "عندما تتكوّن الحركة الثانية، نحدد المنطقة وننتظر ارتداد السعر (Pullback) إليها.", "کاتێک پوڵباکی زۆنەکەمان دەکات، <b>Long position</b> دادەنێین و buy دەکەین.": "عندما يرتد السعر إلى منطقتنا، نفتح <b>Long position</b> ونشتري.", "کاتێک نرخ دەگەڕێتەوە ناو زۆنەکە، لێرەدا <b>Long position</b> دەکەینەوە: <b>سەوز</b> ئامانجە (TP)، و <b>سوور</b> Stop Loss ە لە ژێر زۆنەکە.": "عندما يعود السعر إلى المنطقة، نفتح هنا <b>Long position</b> (صفقة شراء): الجزء <b>الأخضر</b> هو الهدف (TP) والجزء <b>الأحمر</b> هو وقف الخسارة أسفل المنطقة مباشرة.", "کاتێک نرخ دەگەڕێتەوە ناو زۆنەکە، لێرەدا <b>Short position</b> دەکەینەوە: <b>سەوز</b> ئامانجە (TP) لە خوارەوە، و <b>سوور</b> Stop Loss ە لە سەرووی زۆنەکە.": "عندما يعود السعر إلى المنطقة، نفتح هنا <b>Short position</b> (صفقة بيع): الجزء <b>الأخضر</b> هو الهدف (TP) في الأسفل والجزء <b>الأحمر</b> هو وقف الخسارة أعلى المنطقة مباشرة.", "ئیندیکەیتەری <b>RSI</b> لە ژێر چارتەکەیە: زیاد کڕین و زیاد فرۆشتن دیاری دەکات.": "مؤشر <b>RSI</b> تحت الشارت: يحدد التشبع الشرائي والتشبع البيعي.", "دوو هێڵی هەیە: <b>٧٠</b> و <b>٣٠</b>. نرخ دەبێت لە نێوانیاندا بێت.": "له خطان: <b>70</b> و<b>30</b>. ويجب أن يبقى السعر بينهما.", "RSI گەیشتە سەروو ٧٠ = <b>Over Buy</b>، و نرخ دادەبەزێت.": "وصل RSI فوق 70 = <b>Over Buy</b>، والسعر يهبط.", "ژێر ٣٠ = <b>Over Sold</b> (نموونە ٢٤) و نرخ بەرز دەبێتەوە. تەنها بۆ دڵنیابوونەوەیە و ترەیدی لەسەر ناکرێت.": "تحت 30 = <b>Over Sold</b> (مثلًا 24) والسعر يرتفع. هو للتأكيد فقط ولا يُتداول بناءً عليه.", "کاندڵی <b>Bullish</b> (سەوز): نرخ بەرز بۆتەوە.": "شمعة <b>Bullish</b> (خضراء): السعر ارتفع.", "<b>High (H)</b> بەرزترین خاڵە و <b>Low (L)</b> نزمترین؛ ئەو هێڵانە شادۆن.": "<b>High (H)</b> أعلى نقطة و<b>Low (L)</b> أدنى نقطة؛ وهذه الخطوط هي الظلال.", "<b>Open (O)</b> شوێنی کرانەوە و <b>Close (C)</b> داخران؛ لە Bullish دا C سەرووی O یە.": "<b>Open (O)</b> نقطة الفتح و<b>Close (C)</b> الإغلاق؛ في الـ Bullish يكون C فوق O.", "کاندڵی <b>Bearish</b> (سوور): پێچەوانەیە، O لە سەرەوە و C لە خوارەوە.": "شمعة <b>Bearish</b> (حمراء): العكس، O في الأعلى وC في الأسفل.", "کاندڵی <b>Momentum</b>: بەهێزە و شادۆی نییە یان زۆر کەمە؛ واتا بازاڕ بەو ئاڕاستەیە قەوەتی زۆرە.": "شمعة <b>Momentum</b>: قوية ولا ظل لها أو ظلها صغير جدًا؛ أي أن السوق قوي جدًا في هذا الاتجاه.", "نووکی شادۆی کاندڵەکان شوێنی <b>Liquidity</b> ە؛ کڕیار و فرۆشیار لێرەن.": "أطراف ظلال الشموع هي مكان <b>Liquidity</b>؛ المشترون والبائعون هنا.", "یەکەم نووک: لیکویدیتییەکی ئاسایی.": "الطرف الأول: سيولة عادية.", "هێڵی لیکویدیتی. سێ جۆرمان هەیە: یەکەم (کەمتر)، دووەم، و سێیەم (<b>بەهێزترین</b>).": "خط السيولة. لدينا ثلاثة أنواع: الأول (الأضعف)، وەم</b>: جارێکی تر دێتەوە بۆ زۆنەکە و دابەزینێکی گەورە دەکات؛ بۆیە سیقە پێکراوە.": "<b>الحركة الثانية</b>: يعود إلى المنطقة مرة أخرى ويقوم بهبوط كبير؛ لذلك هي مُتحقَّق منها.", "ئێستا <b>Valid Resistance (VR)</b> ە. تەنها دووجار بەکاری بهێنە، جاری سێیەم بە ئەگەری زۆرەوە دەشکێت.": "الآن هي <b>Valid Resistance (VR)</b>. استخدمها مرتين فقط، ففي المرة الثالثة غالبًا ما تنكسر.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە بەرز دەبێتەوە.": "<b>الحركة الأولى</b>: يرتفع السعر من المنطقة.", "<b>جووڵەی دووەم</b>: دێتەوە بۆ زۆنەکە و جووڵەیەکی گەورە دەکات.": "<b>الحركة الثانية</b>: يعود إلى المنطقة ويقوم بحركة كبيرة.", "<b>S+S</b>: سەپۆڕت لەگەڵ نزیکترین سەپۆڕت لە خۆیەوە.": "<b>S+S</b>: دعم مع أقرب دعم إليه.", "<b>R+S</b>: سەپۆڕت لەگەڵ نزیکترین ڕیسیستانس. لە هەردووک جۆرەکەی تر بەقەوەتترە.": "<b>R+S</b>: دعم مع أقرب مقاومة. وهي أقوى من النوعين الآخرين.", "<b>جووڵەی یەکەم</b>: نرخ لە زۆنەکەوە دادەبەزێت.": "<b>الحركة الأولى</b>: ينخفض السعر من المنطقة.", "<b>جووڵەی دووەم</b>: دێتەوە بۆ زۆنەکە و دابەزینێکی گەورە دەکات.": "<b>الحركة الثانية</b>: يعود إلى المنطقة ويقوم بهبوط كبير.", "<b>R+R</b>: ڕیسیستانس لەگەڵ نزیکترین ڕیسیستانس.": "<b>R+R</b>: مقاومة مع أقرب مقاومة.", "زۆنێکی گەورەی کڕین (Buy zone) لە 4H یان 1H دیاری دەکەین.": "نحدد منطقة شراء كبيرة (Buy zone) على 4H أو 1H.", "نرخ دادەبەزێتە ناو زۆنەکە.": "ينخفض السعر إلى داخل المنطقة.", "لە 5M یان 15M دا <b>VS</b> دروست دەبێت: ڤاڵد سەپۆڕت، دوو جووڵە.": "على 5M أو 15M يتشكل <b>VS</b>: دعم صالح، حركتان.", "لە پوڵ باک (بازنەکە) داخڵ دەبین و <b>Buy</b> دەکەین.": "ندخل عند الـ Pullback (الدائرة) و<b>Buy</b>.", "لە 5M یان 15M دا <b>RBS</b> دروست دەبێت: ڕیسیستانسێک دەشکێت و دەبێتە سەپۆڕت.": "على 5M أو 15M يتشكل <b>RBS</b>: تنكسر مقاومة وتصبح دعمًا.", "لە 5M یان 15M دا <b>SRR</b> دروست دەبێت: سەپۆڕتێک دوو ڕیسیستانس بە یەکەوە دەشکێنێت.": "على 5M أو 15M يتشكل <b>SRR</b>: دعم يكسر مقاومتين معًا.", "<b>Double Bottom</b>: نرخ دوو جار دەگاتە هەمان زۆنی کڕین و دوو بنکەی هاوشێوە دروست دەکات؛ نیشانەی بەرزبوونەوە.": "<b>Double Bottom</b>: يصل السعر إلى منطقة الشراء نفسها مرتين ويصنع قاعين متشابهين؛ علامة على الصعود.", "<b>Double Top</b>: نرخ دوو جار دەگاتە هەمان زۆنی فرۆشتن و دوو لووتکەی هاوشێوە دروست دەکات؛ نیشانەی دابەزین.": "<b>Double Top</b>: يصل السعر إلى منطقة البيع نفسها مرتين ويصنع قمتين متشابهتين؛ علامة على الهبوط.", "دووجار لێدانی هەمان زۆن (بازنەکان) وەک کۆنفێرمەیشن بەکار دێت.": "ضرب المنطقة نفسها مرتين (الدوائر) يُستخدم كتأكيد.", "<b>QM بۆ کڕین</b>: نرخ بنکەی پێشوو دەشکێنێت و دەچێتە ناو زۆنەکە، پاشان بەرز دەبێتەوە.": "<b>QM للشراء</b>: يكسر السعر القاع السابق ويدخل المنطقة، ثم يرتفع.", "<b>QM بۆ فرۆشتن</b>: نرخ لووتکەی پێشوو دەشکێنێت و دەچێتە ناو زۆنەکە، پاشان دادەبەزێت.": "<b>QM للبيع</b>: يكسر السعر القمة السابقة ويدخل المنطقة، ثم ينخفض.", "QM بەقەوەترین پاتێرنە؛ هەر کامێکیان هەبێت وەک کۆنفێرمەیشن کافییە.": "QM أقوى نمط؛ ووجود أي منهما يكفي كتأكيد.", "نرخ چەند جارێک لە ناو زۆنی کڕین دەچێت و دێت (ڕەنج)، پاشان شادۆیەکی درێژ بەرەو خوارەوە دروست دەکات و دەگەڕێتەوە؛ پاشان بەرز دەبێتەوە.": "يدخل السعر ويخرج من منطقة الشراء عدة مرات (نطاق)، ثم يصنع ظلًا طويلًا نحو الأسفل ويعود؛ ثم يرتفع.", "هەمان شت بۆ فرۆشتن: ڕەنج لە ناو زۆنی فرۆشتن، پاشان شادۆیەکی درێژ بەرەو سەرەوە و دابەزین.": "الشيء نفسه للبيع: نطاق داخل منطقة البيع، ثم ظل طويل نحو الأعلى وهبوط.", "ئەمەش جۆرێکی تری پاتێرنەکانە و وەک کۆنفێرمەیشن بەکار دێت.": "وهذا نوع آخر من الأنماط ويُستخدم كتأكيد.", "زۆنێکی گەورەی کڕین (<b>Buy zone</b>) لە 4H یان 1H دیاری دەکەین.": "نحدد منطقة شراء كبيرة (<b>Buy zone</b>) على 4H أو 1H.", "بازاڕ دادەبەزێتە ناو زۆنەکە.": "ينخفض السوق إلى داخل المنطقة.", "کۆنفێرمەیشنی <b>VS</b> دروست دەبێت، پاشان بازاڕ <b>IVR</b>ی پێش خۆی دەشکێنێت.": "يتشكل تأكيد <b>VS</b>، ثم يكسر السوق الـ <b>IVR</b> الذي قبله.", "سەوزە (پوڵ باکی IVR) داخڵبوونی بێ ڕیسکترە؛ لێرە (پوڵ باکی VS) دەشێت بەڵام ڕیسکی زیاترە.": "الأخضر (Pullback الـ IVR) هو الدخول الأقل مخاطرة؛ وهنا (Pullback الـ VS) ممكن لكن مخاطرته أكبر.", "زۆنێکی گەورەی فرۆشتن (<b>Sell zone</b>) لە 4H یان 1H دیاری دەکەین.": "نحدد منطقة بيع كبيرة (<b>Sell zone</b>) على 4H أو 1H.", "بازاڕ دێتە ناو زۆنەکە و <b>VR</b> دروست دەبێت.": "يأتي السوق إلى المنطقة ويتشكل <b>VR</b>.", "دواتر VRەکە دەشکێت و دەبێتە <b>IVS</b>.": "ثم ينكسر الـ VR ويصبح <b>IVS</b>.", "سەوزە (پوڵ باکی IVS) داخڵبوونی بێ ڕیسکترە؛ پرتەقاڵیەکە (پوڵ باکی VR) ڕیسکی زیاترە.": "الأخضر (Pullback الـ IVS) هو الدخول الأقل مخاطرة؛ والبرتقالي (Pullback الـ VR) أكثر مخاطرة.", "زۆنی گەورە دیاری دەکەین و بازاڕ دەچێتە ناوی.": "نحدد منطقة كبيرة ويدخل السوق إليها.", "لە ناو زۆنەکەدا چەند جۆرێک کۆنفێرمەیشن دروست دەبێت: <b>IVR</b> ، <b>RBS</b> ، <b>VS , SRR</b>.": "داخل المنطقة تتشكل عدة أنواع من التأكيد: <b>IVR</b> و<b>RBS</b> و<b>VS, SRR</b>.", "بۆ کام زۆنمان دێتەوە؟ بۆ ئەو زۆنەی ڕیجێکشنی تێدا کرد.": "إلى أي منطقة يعود؟ إلى المنطقة التي حدث فيها رفض (Rejection).", "بازاڕ VRەکەی پێش خۆی شکاندووە، کەواتە بەرەو سەرەوە دەڕوات و لە پوڵ باکدا داخڵ دەبین.": "السوق كسر الـ VR الذي قبله، لذلك هو صاعد وندخل عند الـ Pullback.", "<b>VR</b> ێکی ڤاڵد دروست دەبێت لە <b>R+R</b>: دوو ڕیسیستانس. هێڵی سەرەوە سەری لووتکەکەیە و هێڵی خوارەوە سەری کاندڵی گەڕانەوەی دوای دابەزینە؛ نێوانیان زۆنەکەیە. دواتر نرخ دادەبەزێت.": "تتشكل <b>VR</b> صالحة من <b>R+R</b>: مقاومتان. الخط العلوي رأس القمة والخط السفلي رأس شمعة الارتداد بعد الهبوط؛ والمنطقة بينهما. ثم ينخفض السعر.", "نرخ دێتەوە بۆ زۆنەکە و یەکەم تەچی پێ دەکات: <b>ڕیسپێکت</b>.": "يعود السعر إلى المنطقة ويصنع اللمسة الأولى: <b>احترام (respect)</b>.", "دواتر زۆنەکە دەشکێنێت (<b>break</b>): ئێستا <b>Inversion</b> ە.": "ثم يكسر المنطقة (<b>break</b>): وهي الآن <b>Inversion</b>.", "ئەو لووتکەیەی کە گەڕاندیەوە بۆ زۆنەکە و یەکەم تەچی پێ کرد؛ هێڵەکەی دیاری دەکەین.": "القمة التي أعادته إلى المنطقة وصنعت اللمسة الأولى؛ نحدد خطها.", "ئەو لووتکەیە دەشکێنێت: <b>Break of Structure</b>.": "يكسر تلك القمة: <b>Break of Structure</b>.", "نرخ بە یەک کاندڵ ناگەڕێتەوە؛ بە سێ چوار کاندڵ دەگەڕێتەوە بۆ زۆنە شکاوەکە (<b>pull back</b>): ئەمە <b>PO2</b> — گوڵی SNRZ. بە کۆنفێرمەیشن داخڵ دەبین و ستۆپ لە ژێر زۆنەکەیە.": "لا يعود السعر بشمعة واحدة؛ بل في ثلاث أو أربع شموع يعود إلى المنطقة المكسورة (<b>pull back</b طقة؛ نأخذ التأكيد على 5 دقائق و1 دقيقة ونبيع.", "<b>Double Bottom</b>: دوو بنکەی هاوشێوە؛ نیشانەی بەرزبوونەوە.": "<b>Double Bottom</b>: قاعان متشابهان؛ علامة على الصعود.", "<b>Double Top</b>: دوو لووتکەی هاوشێوە؛ نیشانەی دابەزین.": "<b>Double Top</b>: قمتان متشابهتان؛ علامة على الهبوط.", "<b>QM</b>: بەقەوەترین پاتێرنە. هەر کامێکیان هەبێت وەک کۆنفێرمەیشن کافییە.": "<b>QM</b>: أقوى نمط. وجود أي واحد منها يكفي كتأكيد.", "زۆنێکی گەورەی کڕینمان هەیە لە 4H یان 1H.": "لدينا منطقة شراء كبيرة على 4H أو 1H.", "لە تایم فرەیمی 5M یان 15M دا <b>VS</b> دروست دەبێت (یەکێک لە چوار کۆنفێرمەیشنەکە: VS ، RBS ، SRR ، IVR).": "على الإطار 5M أو 15M يتشكل <b>VS</b> (أحد التأكيدات الأربعة: VS وRBS وSRR وIVR).", "باشترە چاوەڕێی شکان بکەین و لە <b>پوڵ باک</b> دا داخڵ بین.": "الأفضل أن ننتظر الكسر وندخل عند الـ <b>Pullback</b>.", "ئەنجام: <b>Buy</b>. بۆ فرۆشتن: VR ، SBR ، RSS ، IVS. چاوەڕێی کۆنفێرمەیشن بکە و پەلە مەکە.": "النتيجة: <b>Buy</b>. للبيع: VR وSBR وRSS وIVS. انتظر التأكيد ولا تستعجل.", "زۆنێکی ڤاڵد.": "منطقة صالحة.", "نرخ دێتەوە و <b>PO2</b> دروست دەکات.": "يعود السعر ويُكوّن <b>PO2</b>.", "بەڵام ئەم جارە زۆنەکە <b>ڕیسپێکت ناکات</b> و دەیشکێنێت.": "لكنه هذه المرة <b>لا يحترم</b> المنطقة ويكسرها.", "کە دێتەوە بۆ زۆنە شکاوەکە لە پوڵ باکدا: <b>Inversion PO2 (IPO2)</b>.": "عندما يعود إلى المنطقة المكسورة عند الـ Pullback: <b>Inversion PO2 (IPO2)</b>.", "<b>ڤاڵد سەپۆڕت (VS)</b> مان هەیە: دوو جووڵەی کردووە و کڕیارەکان لێی بەرز بوونەتەوە.": "لدينا <b>دعم صالح (VS)</b>: قام بحركتين وصعد منه السعر بفضل المشترين.", "بازاڕ دێتەوە بۆ زۆنەکە.": "يعود السوق إلى المنطقة.", "زۆنەکە دەشکێنێت: کاندڵ بە بەدی لە خوارووی زۆنەکە دادەخات و <b>75%</b> یان زیاتری لە دەرەوەیە؛ یاخود یەک دوو کاندڵ لە دەرەوە دادەخەن. ئێستا <b>Inversion</b> ە: ڤاڵد سەپۆڕت دەبێتە <b>IVS</b> و زۆنی سێڵ.": "يكسر المنطقة: تُغلق شمعة بجسمها تحت المنطقة ويكون <b>75%</b> أو أكثر منها خارجها؛ أو تُغلق شمعة أو شمعتان خارجها. أصبح الآن <b>Inversion</b>: الدعم الصالح يصبح <b>IVS</b> ومنطقة بيع.", "لە پوڵ باکدا (٣ - ٤ کاندڵ) دێتەوە بۆ زۆنە
